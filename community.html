<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Imperial Temple Gate - Imperial Divine Vision</title>
    <style>
        /* Alive, breathing deep royal blue & purple silk-shifting animation moving dynamically */
        @keyframes royalSilkFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Subtle waving motion for the main gate container */
        @keyframes containerWave {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.002); }
        }

        /* Shimmering light reflex shifting across the frame */
        @keyframes lightReflex {
            0% { opacity: 0.3; filter: brightness(1); }
            50% { opacity: 0.6; filter: brightness(1.2); }
            100% { opacity: 0.3; filter: brightness(1); }
        }

        body { 
            font-family: 'Georgia', serif; 
            margin: 0; 
            min-height: 100vh; 
            color: #f3e8ff;
            background: linear-gradient(135deg, #030712, #0f172a, #1e1b4b, #3b0764, #581c87, #1e1b4b, #030712);
            background-size: 400% 400%;
            animation: royalSilkFlow 18s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto; /* Allows smooth scrolling up and down on all devices */
            position: relative;
            padding: 40px 15px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(147, 51, 234, 0.18), rgba(3, 7, 18, 0.75));
            pointer-events: none;
            z-index: 1;
            animation: lightReflex 8s ease-in-out infinite alternate;
        }

        .container { 
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.90);
            border: 2px solid;
            border-image: linear-gradient(to bottom, #fde047, #ca8a04, #713f12) 1;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 35px rgba(234, 179, 8, 0.22);
            padding: 30px; 
            border-radius: 6px; 
            text-align: center; 
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(12px);
            animation: containerWave 6s ease-in-out infinite, gateReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @keyframes gateReveal {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Your stunning community.png crown & purple silk banner */
        .gate-image-frame {
            width: 100%;
            height: 240px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(234, 179, 8, 0.7);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            position: relative;
        }

        .gate-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s ease, filter 1.2s ease;
        }

        h1 {
            font-size: 1.4rem;
            color: #fde047;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(234, 179, 8, 0.4);
        }

        p {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e2e8f0;
        }

        input {
            width: 85%;
            padding: 12px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #b45309;
            border-radius: 4px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        input:focus {
            border-color: #fde047;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        button {
            margin-top: 5px;
            background: linear-gradient(135deg, #ca8a04, #854d0e);
            color: #fff;
            border: 1px solid #fde047;
            padding: 11px 32px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(202, 138, 4, 0.3);
            font-family: 'Georgia', serif;
        }

        button:hover {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.5);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 2px;
            display: none;
        }

        .royal-branding { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 90px; 
            z-index: 100; 
            pointer-events: none;
            opacity: 0.85;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        /* Cinematic Gate Opening & Light Surge Transition Effect */
        .gate-opening .gate-image-frame img {
            transform: scale(1.18);
            filter: brightness(1.9) contrast(1.25) blur(1px);
        }

        .gate-opening {
            transform: scale(1.04);
            opacity: 0;
            filter: blur(8px);
            transition: all 0.9s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .container { padding: 20px 15px; }
            .gate-image-frame { height: 190px; }
        }
    </style>
</head>
<body>

    <div class="container" id="gateContainer">
        <div class="gate-image-frame">
            <img src="community.png" alt="Imperial Temple Gate">
        </div>

        <h1>Worldwide Sanctuary</h1>
        <p>Enter your <strong>Email</strong> and <strong>Birth Year</strong> to restore your global account, coins, and purchases across any device:</p>
        
        <form id="ageGateForm">
            <div class="input-group">
                <label for="userEmail">Your Account Email:</label>
                <input type="email" id="userEmail" placeholder="name@example.com" required>

                <label for="birthYear">Birth Year:</label>
                <input type="number" id="birthYear" placeholder="YYYY" min="1900" max="2026" required>

                <div class="error-msg" id="errorMsg">Please verify your details.</div>
                <button type="submit">Open Gate & Restore Vault</button>
            </div>
        </form>
    </div>

    <img src="official-seal.png" class="royal-branding" alt="Imperial Divine Vision Seal">
    <audio id="gateSound" src="https://assets.mixkit.co/active_storage/sfx/2529/2529-preview.mp3" preload="auto"></audio>

    <script>
        document.getElementById('ageGateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('userEmail').value.trim().toLowerCase();
            const yearInput = document.getElementById('birthYear').value;
            const errorMsg = document.getElementById('errorMsg');
            const gateContainer = document.getElementById('gateContainer');
            const gateSound = document.getElementById('gateSound');

            const year = parseInt(yearInput);
            const currentYear = new Date().getFullYear();
            
            if (!emailInput || !year || isNaN(year) || year < 1900 || year > currentYear) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            localStorage.setItem('imperial_user_email', emailInput);
            localStorage.setItem('imperial_birth_year', year);

            const age = currentYear - year;

            // Play heavy gate-opening sound
            gateSound.play().catch(e => console.log("Audio play prevented:", e));
            gateContainer.classList.add('gate-opening');

            let destination = 'room-kids.html';
            if (year === 2000 || age >= 30) {
                destination = 'room-adult.html';
            } else if (age >= 8 && age <= 13) {
                destination = 'room-youth.html';
            } else if (age >= 14 && age <= 29) {
                destination = 'room-elder.html';
            }

            setTimeout(() => {
                window.location.href = destination;
            }, 850);
        });
    </script>

</body>
</html>
