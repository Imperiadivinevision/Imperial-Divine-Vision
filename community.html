<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Imperial Temple Gate • Imperial Divine Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        @keyframes royalSilkFlow {
            0% { transform: scale(1); filter: brightness(1) saturate(1.1); }
            50% { transform: scale(1.03); filter: brightness(1.12) saturate(1.25); }
            100% { transform: scale(1); filter: brightness(1) saturate(1.1); }
        }

        @keyframes lightGlow {
            0% { opacity: 0.2; }
            50% { opacity: 0.5; }
            100% { opacity: 0.2; }
        }

        /* Realistic Metallic Gold Shimmer for Seals and Accents */
        @keyframes metallicShine {
            0% { filter: drop-shadow(0 0 10px rgba(191, 149, 63, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(252, 246, 186, 0.8)); }
            100% { filter: drop-shadow(0 0 10px rgba(191, 149, 63, 0.5)); }
        }

        body { 
            font-family: 'Playfair Display', serif; 
            margin: 0; 
            min-height: 100vh; 
            color: #f4f0ea;
            background: url('community.png') no-repeat center center fixed;
            background-size: cover;
            animation: royalSilkFlow 26s ease-in-out infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            position: relative;
            padding: 40px 15px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 25%, rgba(191, 149, 63, 0.12), rgba(8, 2, 15, 0.85));
            pointer-events: none;
            z-index: 1;
            animation: lightGlow 12s ease-in-out infinite alternate;
        }

        /* The Imperial Obsidian & Burnished Gold Stele */
        .container { 
            position: relative;
            z-index: 10;
            background: rgba(12, 5, 22, 0.94);
            /* Realistic Multi-Stitched Metallic Gold Border */
            border: 2px solid transparent;
            border-image: linear-gradient(to bottom, #fcf6ba, #bf953f, #b38728, #aa771c, #533f03) 1;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95), inset 0 0 40px rgba(191, 149, 63, 0.18);
            padding: 45px 35px; 
            border-radius: 8px; 
            text-align: center; 
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(18px);
            animation: gateReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @keyframes gateReveal {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Realistic Metallic Gold Seal Badge */
        .imperial-seal-badge {
            width: 76px;
            height: 76px;
            margin: -68px auto 16px auto;
            background: linear-gradient(135deg, #fcf6ba 0%, #bf953f 40%, #b38728 70%, #533f03 100%);
            border: 2px solid #fff3cd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.6);
            animation: metallicShine 5s ease-in-out infinite;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            /* Realistic Metallic Gold Text Gradient */
            background: linear-gradient(135deg, #fcf6ba 0%, #d4af37 50%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            filter: drop-shadow(0 2px 8px rgba(170, 119, 28, 0.4));
        }

        p {
            font-size: 0.92rem;
            color: #d2ccc6;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Stored Rewards Live Preview with Metallic Gold Edge */
        .rewards-preview {
            background: rgba(191, 149, 63, 0.08);
            border: 1px dashed rgba(191, 149, 63, 0.45);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.84rem;
            color: #fcf6ba;
            letter-spacing: 1px;
            display: none;
            box-shadow: inset 0 0 10px rgba(191, 149, 63, 0.15);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        label {
            font-family: 'Cinzel', serif;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e2d9cd;
        }

        input {
            width: 88%;
            padding: 12px;
            background: rgba(8, 3, 15, 0.96);
            border: 1px solid #997322;
            border-radius: 4px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Playfair Display', serif;
        }

        input:focus {
            border-color: #fcf6ba;
            box-shadow: 0 0 15px rgba(252, 246, 186, 0.4);
        }

        /* Stunning Burnished Metallic Gold Button */
        button {
            margin-top: 8px;
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #fcf6ba 0%, #bf953f 35%, #aa771c 100%);
            color: #12051a;
            border: 1px solid #fff3cd;
            padding: 13px 35px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(170, 119, 28, 0.45);
        }

        button:hover {
            background: linear-gradient(135deg, #ffffee 0%, #fcf6ba 40%, #bf953f 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252, 246, 186, 0.65);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 2px;
            display: none;
        }

        .royal-branding { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 90px; 
            z-index: 100; 
            pointer-events: none;
            opacity: 0.85;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        /* Immersive Gate Opening Transition Effect */
        .gate-opening {
            transform: scale(1.05);
            opacity: 0;
            filter: blur(12px) brightness(1.6);
            transition: all 0.9s cubic-bezier(0.77, 0, 0.175, 1);
        }

        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            .container { padding: 30px 20px; width: 95%; }
        }
    </style>
</head>
<body>

    <!-- Imperial Obsidian & Burnished Gold Stele -->
    <div class="container" id="gateContainer">
        <div class="imperial-seal-badge">👑</div>
        
        <h1>Worldwide Sanctuary</h1>
        <p>Present your <strong>Email</strong> and <strong>Birth Year</strong> to unlock the gate and claim your stored rewards and global vault:</p>
        
        <!-- Live Stored Rewards Preview -->
        <div class="rewards-preview" id="rewardsPreview">
            ✨ Stored Vault Found! Coins: <span id="previewCoins">0</span> 🪙 | Total Spent: $<span id="previewSpent">0.00</span>
        </div>

        <form id="ageGateForm">
            <div class="input-group">
                <label for="userEmail">Your Account Email:</label>
                <input type="email" id="userEmail" placeholder="name@example.com" required oninput="checkStoredRewards(this.value)">

                <label for="birthYear">Birth Year:</label>
                <input type="number" id="birthYear" placeholder="YYYY" min="1900" max="2026" required>

                <div class="error-msg" id="errorMsg">Please verify your credentials.</div>
                <button type="submit">Open Gate & Claim Rewards</button>
            </div>
        </form>
    </div>

    <!-- Official Seal Branding -->
    <img src="official-seal.png" class="royal-branding" alt="Imperial Divine Vision Seal">
    
    <!-- Audio element for heavy physical gate-opening sound effect -->
    <audio id="gateSound" src="https://assets.mixkit.co/active_storage/sfx/2529/2529-preview.mp3" preload="auto"></audio>

    <script>
        function checkStoredRewards(email) {
            if (!email || !email.includes('@')) {
                document.getElementById('rewardsPreview').style.display = 'none';
                return;
            }
            const key = `imperial_vault_${email.trim().toLowerCase()}`;
            let vaultData = localStorage.getItem(key);
            if (vaultData) {
                let vault = JSON.parse(vaultData);
                document.getElementById('previewCoins').innerText = vault.coins.toLocaleString();
                document.getElementById('previewSpent').innerText = vault.spent.toFixed(2);
                document.getElementById('rewardsPreview').style.display = 'block';
            } else {
                document.getElementById('rewardsPreview').style.display = 'none';
            }
        }

        document.getElementById('ageGateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('userEmail').value.trim().toLowerCase();
            const yearInput = document.getElementById('birthYear').value;
            const errorMsg = document.getElementById('errorMsg');
            const gateContainer = document.getElementById('gateContainer');
            const gateSound = document.getElementById('gateSound');

            const year = parseInt(yearInput);
            const currentYear = new Date().getFullYear();
            
            if (!emailInput || !year || isNaN(year) || year < 1900 || year > currentYear) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            localStorage.setItem('imperial_user_email', emailInput);
            localStorage.setItem('imperial_birth_year', year);
            localStorage.setItem('active_imperial_email', emailInput);

            const age = currentYear - year;

            // Trigger gate sound and transition
            gateSound.currentTime = 0;
            gateSound.play().catch(e => console.log("Audio play prevented:", e));
            gateContainer.classList.add('gate-opening');

            let destination = 'room-kids.html';
            if (year === 2000 || age >= 30) {
                destination = 'room-adult.html';
            } else if (age >= 8 && age <= 13) {
                destination = 'room-youth.html';
            } else if (age >= 14 && age <= 29) {
                destination = 'room-elder.html';
            }

            setTimeout(() => {
                window.location.href = destination;
            }, 850);
        });
    </script>

</body>
</html>
