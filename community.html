<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Imperial Temple Gate - Imperial Divine Vision</title>
    <style>
        /* Alive, breathing motion for the grand purple velvet background */
        @keyframes bgBreath {
            0% { transform: scale(1); filter: brightness(1) saturate(1.1); }
            50% { transform: scale(1.03); filter: brightness(1.1) saturate(1.25); }
            100% { transform: scale(1); filter: brightness(1) saturate(1.1); }
        }

        /* Shimmering light reflex shifting across the royal stage */
        @keyframes lightGlow {
            0% { opacity: 0.25; }
            50% { opacity: 0.55; }
            100% { opacity: 0.25; }
        }

        body { 
            font-family: 'Georgia', serif; 
            margin: 0; 
            min-height: 100vh; 
            color: #f3e8ff;
            /* community.png as the grand full-screen background */
            background: url('community.png') no-repeat center center fixed;
            background-size: cover;
            animation: bgBreath 20s ease-in-out infinite alternate;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            position: relative;
            padding: 30px 15px;
        }

        /* Royal lighting overlay to add depth and make the stage feel alive */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.15), rgba(11, 2, 20, 0.75));
            pointer-events: none;
            z-index: 1;
            animation: lightGlow 9s ease-in-out infinite alternate;
        }

        /* Floating Crystal Altar Container in the Center */
        .container { 
            position: relative;
            z-index: 10;
            background: rgba(15, 7, 28, 0.88);
            border: 2px solid;
            border-image: linear-gradient(to bottom, #fde047, #ca8a04, #713f12) 1;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(234, 179, 8, 0.25);
            padding: 35px 30px; 
            border-radius: 8px; 
            text-align: center; 
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(16px);
            animation: gateReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto;
        }

        @keyframes gateReveal {
            from { opacity: 0; transform: translateY(25px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            font-size: 1.5rem;
            color: #fde047;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 0 2px 10px rgba(234, 179, 8, 0.5);
        }

        p {
            font-size: 0.92rem;
            color: #cbd5e1;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e2e8f0;
        }

        input {
            width: 85%;
            padding: 12px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #b45309;
            border-radius: 4px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        input:focus {
            border-color: #fde047;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }

        button {
            margin-top: 8px;
            background: linear-gradient(135deg, #ca8a04, #854d0e);
            color: #fff;
            border: 1px solid #fde047;
            padding: 12px 35px;
            font-size: 0.92rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 18px rgba(202, 138, 4, 0.4);
            font-family: 'Georgia', serif;
        }

        button:hover {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(234, 179, 8, 0.6);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.8rem;
            margin-top: 2px;
            display: none;
        }

        .royal-branding { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            width: 90px; 
            z-index: 100; 
            pointer-events: none;
            opacity: 0.85;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
        }

        /* Cinematic Gate Opening & Light Surge Transition Effect */
        .gate-opening {
            transform: scale(1.05);
            opacity: 0;
            filter: blur(10px);
            transition: all 0.9s cubic-bezier(0.77, 0, 0.175, 1);
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 600px) {
            body { padding: 15px 10px; }
            .container { padding: 25px 15px; width: 95%; }
        }
    </style>
</head>
<body>

    <!-- Floating Central Crystal Altar -->
    <div class="container" id="gateContainer">
        <h1>Worldwide Sanctuary</h1>
        <p>Enter your <strong>Email</strong> and <strong>Birth Year</strong> to restore your global account, coins, and purchases across any device:</p>
        
        <form id="ageGateForm">
            <div class="input-group">
                <label for="userEmail">Your Account Email:</label>
                <input type="email" id="userEmail" placeholder="name@example.com" required>

                <label for="birthYear">Birth Year:</label>
                <input type="number" id="birthYear" placeholder="YYYY" min="1900" max="2026" required>

                <div class="error-msg" id="errorMsg">Please verify your details.</div>
                <button type="submit">Open Gate & Restore Vault</button>
            </div>
        </form>
    </div>

    <!-- Official Seal Branding -->
    <img src="official-seal.png" class="royal-branding" alt="Imperial Divine Vision Seal">

    <!-- Heavy Physical Gate Opening Sound Effect -->
    <audio id="gateSound" src="https://assets.mixkit.co/active_storage/sfx/2529/2529-preview.mp3" preload="auto"></audio>

    <script>
        document.getElementById('ageGateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('userEmail').value.trim().toLowerCase();
            const yearInput = document.getElementById('birthYear').value;
            const errorMsg = document.getElementById('errorMsg');
            const gateContainer = document.getElementById('gateContainer');
            const gateSound = document.getElementById('gateSound');

            const year = parseInt(yearInput);
            const currentYear = new Date().getFullYear();
            
            if (!emailInput || !year || isNaN(year) || year < 1900 || year > currentYear) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            localStorage.setItem('imperial_user_email', emailInput);
            localStorage.setItem('imperial_birth_year', year);

            const age = currentYear - year;

            // Play heavy gate opening sound effect
            gateSound.play().catch(e => console.log("Audio play prevented:", e));
            gateContainer.classList.add('gate-opening');

            let destination = 'room-kids.html';
            if (year === 2000 || age >= 30) {
                destination = 'room-adult.html';
            } else if (age >= 8 && age <= 13) {
                destination = 'room-youth.html';
            } else if (age >= 14 && age <= 29) {
                destination = 'room-elder.html';
            }

            setTimeout(() => {
                window.location.href = destination;
            }, 850);
        });
    </script>

</body>
</html>
