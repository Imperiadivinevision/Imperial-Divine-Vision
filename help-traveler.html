<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help a Traveler — Village of Ikmid | Imperial Divine Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs for Worldwide Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @keyframes imperialSilkWave {
            0% { background-position: 0% 50%; filter: brightness(1); }
            15% { background: linear-gradient(120deg, #07261d, #004d61, #082844, #120b22, #210c20); background-position: 25% 75%; }
            30% { background: linear-gradient(140deg, #04140f, #001f30, #030f24, #18062b, #19081e); background-position: 50% 100%; }
            45% { background: linear-gradient(160deg, #061c16, #09172e, #140b2e, #250a36, #1f0b24); background-position: 75% 25%; }
            60% { background: linear-gradient(135deg, #082119, #0e1236, #210d33, #380d35, #2b1126); background-position: 100% 50%; }
            80% { background: linear-gradient(110deg, #051912, #003042, #0a1733, #150726, #1e0a1f); background-position: 50% 25%; }
            100% { background-position: 0% 50%; filter: brightness(1.1); }
        }

        @keyframes breathingPulse {
            0% { transform: scale(1); filter: contrast(1); }
            50% { transform: scale(1.01); filter: contrast(1.05); }
            100% { transform: scale(1); filter: contrast(1); }
        }

        @keyframes emeraldRuneShimmer {
            0% { box-shadow: 0 0 8px rgba(121,255,230,0.5); border-color: rgba(121,255,230,0.7); background: rgba(121,255,230,0.12); }
            50% { box-shadow: 0 0 25px rgba(121,255,230,0.95), inset 0 0 15px rgba(121,255,156,0.6); border-color: #79ff9c; background: rgba(121,255,156,0.25); }
            100% { box-shadow: 0 0 8px rgba(121,255,230,0.5); border-color: rgba(121,255,230,0.7); background: rgba(121,255,230,0.12); }
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.8); opacity: 1; color: #79ff9c; text-shadow: 0 0 10px #000; }
            100% { transform: translateY(-55px) scale(1.2); opacity: 0; color: #79ffe6; text-shadow: 0 0 15px #79ffe6; }
        }

        :root {
            --panel-bg: rgba(10, 18, 15, 0.94);
            --theme-color: #79ffe6;
            --text-main: #f5f2eb;
            --text-muted: #c5b59b;
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #051912, #002b3d, #0b1d3a, #1a082e, #2d0f28);
            background-size: 400% 400%;
            animation: imperialSilkWave 18s ease infinite, breathingPulse 8s ease-in-out infinite alternate;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav { 
            padding: 12px 20px; 
            background: var(--panel-bg);
            border-bottom: 2px solid var(--theme-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }
        nav a { color: var(--text-main); text-decoration: none; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        nav a:hover { color: var(--theme-color); }

        .cinematic-stage {
            position: relative;
            width: 96%;
            max-width: 1500px;
            height: 72vh;
            min-height: 450px;
            margin: 15px auto;
            border: 4px ridge var(--theme-color);
            border-radius: 16px;
            overflow: hidden;
            background: #020504;
            box-shadow: 0 0 80px rgba(0,0,0,0.95), inset 0 0 40px rgba(0,40,25,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinematic-stage video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-quest-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(4, 14, 11, 0.98), rgba(4, 14, 11, 0.88));
            border-top: 2px solid var(--theme-color);
            padding: 14px 20px;
            box-sizing: border-box;
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        .village-hud {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 45, 28, 0.9);
            border: 1px solid var(--theme-color);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .village-hud span { color: #79ffe6; font-weight: bold; }

        .royal-btn {
            background: linear-gradient(to bottom, #00b4d8, #0077b6);
            color: #fff;
            border: 1px solid #79ffe6;
            padding: 9px 18px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s;
            display: inline-block;
            margin: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }
        .royal-btn:hover { background: #79ffe6; color: #0b0f0e; box-shadow: 0 0 22px #79ffe6; transform: translateY(-1px); }

        .choice-btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .gathering-hotspot {
            position: absolute;
            width: 70px;
            height: 48px;
            border: 2px solid rgba(121, 255, 230, 0.85);
            border-radius: 8px;
            cursor: pointer;
            z-index: 50;
            animation: emeraldRuneShimmer 1.8s infinite ease-in-out;
            display: none;
        }
        .gathering-hotspot:hover { border-color: #79ff9c; transform: scale(1.12); }

        .floating-popup {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.05rem;
            z-index: 100;
            pointer-events: none;
            animation: floatUpAndFade 1s ease-out forwards;
        }

        .sync-bar {
            margin: 8px auto 15px auto;
            text-align: center;
            font-size: 0.85srem;
        }
        .sync-bar input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--theme-color);
            background: rgba(0,0,0,0.6);
            color: white;
            font-family: 'Cinzel', serif;
            width: 260px;
            max-width: 80%;
            margin-right: 8px;
        }
    </style>
</head>
<body onload="initTravelerExperience()">

    <nav> 
        <a href="room-youth.html">🏛️ Hub Menu</a>
        <a href="map.html">🗺️ World Map</a>
        <a href="shop.html">🛒 Market Stalls</a>
        <a href="help-traveler.html" style="color: var(--theme-color);">🤝 Help a Traveler</a>
    </nav>

    <h1 style="color: var(--theme-color); font-size: 1.8rem; margin: 12px 0 2px 0; text-align: center; text-shadow: 0 0 18px rgba(121,255,230,0.5);">Help a Traveler — Village of Ikmid</h1>
    
    <div class="sync-bar">
        <input type="email" id="userEmailSync" placeholder="Enter email for worldwide sync..." onchange="updatePlayerEmail()">
        <button class="royal-btn" onclick="syncToCloud()" style="padding: 6px 14px; font-size: 0.75rem;">☁️ Sync Cloud</button>
    </div>

    <div class="cinematic-stage" id="stage-container">
        <!-- Main Video Pipeline with Sound Enabled -->
        <video id="traveler-video" autoplay controls playsinline>
            <source src="village-plea.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Gathering Hotspots -->
        <div id="hotspot-container">
            <div class="gathering-hotspot" id="spot-apple" style="top: 15% !important; left: 75% !important;" onclick="gatherItem('Apples', 3, this, '🍎 +3 Apples')" title="Gather Apples"></div>
            <div class="gathering-hotspot" id="spot-herb" style="top: 72% !important; left: 42% !important;" onclick="gatherItem('Glowing Herbs', 4, this, '🌿 +4 Herbs')" title="Gather Glowing Herbs"></div>
            <div class="gathering-hotspot" id="spot-coin" style="top: 80% !important; left: 62% !important;" onclick="gatherItem('Gold Coins', 50, this, '🪙 +50 Coins')" title="Collect Shimmering Coins"></div>
            <div class="gathering-hotspot" id="spot-wood" style="top: 60% !important; left: 15% !important;" onclick="gatherItem('Wood Sticks', 3, this, '🪵 +3 Wood')" title="Gather Wood Supplies"></div>
        </div>

        <div class="video-quest-overlay" id="quest-overlay-bar">
            <div class="village-hud">
                <div>Rank: <span id="ui-level">Level 1</span></div>
                <div>Wallet: <span id="ui-coins">550</span> 🪙</div>
                <div>Tries Left: <span id="ui-tries">2 / 2</span></div>
                <div>Inventory: <span id="ui-inventory">Empty</span></div>
            </div>
            
            <div id="overlay-dialogue-content">
                <p id="spokenDialogue" style="color: var(--theme-color); font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                    "Our village traveler pleads for assistance. Do you accept this mission to gather forest supplies?"
                </p>
                <div class="choice-btn-group" id="actionButtonContainer">
                    <button class="royal-btn" onclick="acceptQuest()">✓ Accept Quest</button>
                    <button class="royal-btn" onclick="declineQuest()" style="background: linear-gradient(to bottom, #cc0000, #660000);">✗ Decline</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://imperial-divine-vision-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const dbRef = firebase.database().ref('imperial_traveler_players');

        let playerState = {
            email: localStorage.getItem('imperial_user_email') || 'traveler@imperial.vision',
            coins: 550,
            level: 1,
            triesRemaining: 2,
            inventory: [],
            collectedApples: 0,
            collectedHerbs: 0,
            collectedCoins: 0,
            collectedWood: 0
        };

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.95;
                utterance.pitch = 1.0;
                // Slight delay so it never clashes instantly with video load
                setTimeout(() => window.speechSynthesis.speak(utterance), 300);
            }
        }

        function initTravelerExperience() {
            document.getElementById('userEmailSync').value = playerState.email;
            loadFromCloud();
            speakText("Help a traveler. Our village traveler pleads for assistance. Do you accept this mission?");
        }

        function updatePlayerEmail() {
            let inputEmail = document.getElementById('userEmailSync').value.trim();
            if (inputEmail && inputEmail.includes('@')) {
                playerState.email = inputEmail;
                localStorage.setItem('imperial_user_email', inputEmail);
                loadFromCloud();
            }
        }

        function syncToCloud() {
            updatePlayerEmail();
            let safeKey = playerState.email.replace(/[.#$\/\[\]]/g, "_");
            dbRef.child(safeKey).set(playerState).then(() => {
                alert("✨ Worldwide progress successfully synced to cloud vault for " + playerState.email + "!");
            }).catch(err => {
                alert("Saved locally! Cloud sync ready.");
            });
        }

        function loadFromCloud() {
            let safeKey = playerState.email.replace(/[.#$\/\[\]]/g, "_");
            dbRef.child(safeKey).once('value').then(snapshot => {
                let data = snapshot.val();
                if (data) {
                    playerState = data;
                    document.getElementById('ui-coins').innerText = playerState.coins;
                    document.getElementById('ui-inventory').innerText = playerState.inventory.length ? playerState.inventory.join(', ') : 'Empty';
                    document.getElementById('ui-tries').innerText = playerState.triesRemaining + ' / 2';
                }
            });
        }

        function acceptQuest() {
            let briefing = "Quest accepted. Entering the Whispering Woods. You are required to collect 3 apples, 4 glowing herbs, 50 gold coins, and 3 wood sticks.";
            speakText(briefing);

            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'save-collection-part1.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();

            videoElement.onended = function() {
                videoElement.currentTime = 0;
                videoElement.play(); 
            };

            document.querySelectorAll('.gathering-hotspot').forEach(spot => spot.style.display = 'block');

            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p id="spokenDialogue" style="color: var(--theme-color); font-family: 'Playfair Display', serif; font-style: italic; margin: 0; font-size: 0.95rem;">
                    "Whispering Woods (Part 1): Click the shimmering square zones to gather Apples (+3), Herbs (+4), Coins (+50), and Wood (+3)!"
                </p>
            `;
            syncToCloud();
        }

        function gatherItem(itemType, amount, element, popupText) {
            let rect = element.getBoundingClientRect();
            let stageRect = document.getElementById('stage-container').getBoundingClientRect();
            let popup = document.createElement('div');
            popup.className = 'floating-popup';
            popup.innerText = popupText;
            popup.style.left = (rect.left - stageRect.left + 10) + 'px';
            popup.style.top = (rect.top - stageRect.top - 10) + 'px';
            document.getElementById('stage-container').appendChild(popup);
            setTimeout(() => popup.remove(), 1000);

            element.style.display = 'none';

            if (itemType === 'Apples') playerState.collectedApples += amount;
            if (itemType === 'Glowing Herbs') playerState.collectedHerbs += amount;
            if (itemType === 'Gold Coins') { playerState.collectedCoins += amount; playerState.coins += amount; }
            if (itemType === 'Wood Sticks') playerState.collectedWood += amount;

            if(!playerState.inventory.includes(itemType + " (Surplus)")) {
                playerState.inventory.push(itemType + " (Surplus)");
            }

            document.getElementById('ui-coins').innerText = playerState.coins;
            document.getElementById('ui-inventory').innerText = playerState.inventory.join(', ');

            speakText("Collected " + itemType);
            syncToCloud();

            if (playerState.collectedApples >= 3 && playerState.collectedHerbs >= 4 && playerState.collectedCoins >= 50 && playerState.collectedWood >= 3) {
                setTimeout(transitionToPart2, 800);
            }
        }

        function transitionToPart2() {
            speakText("Quota secured! Pressing deeper into the woods. Watch out for the Level 3 Armored Wolf!");
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'save-collection-part2.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();

            videoElement.onended = function() {
                triggerWolfEncounter();
            };
        }

        function triggerWolfEncounter() {
            const videoElement = document.getElementById('traveler-video');
            videoElement.pause();
            speakText("A Level 3 Armored Wolf approaches! Will you hide and let it pass safely, or draw your sword and fight?");

            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p style="color: #ff8585; font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                    ⚠️ Level 3 Armored Wolf spotted! What is your tactical choice?
                </p>
                <div class="choice-btn-group">
                    <button class="royal-btn" onclick="chooseHide()" style="background: linear-gradient(to bottom, #1b5e20, #0a2e0e);">🛡️ Hide & Let Wolf Pass (Safe)</button>
                    <button class="royal-btn" onclick="chooseFight()" style="background: linear-gradient(to bottom, #cc0000, #660000);">⚔️ Draw Sword & Fight</button>
                </div>
            `;
        }

        function chooseHide() {
            speakText("Mission success! Returning safely to the village with grand compensation.");
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'mission-success.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();
            videoElement.onended = function() {
                playerState.coins += 550;
                document.getElementById('ui-coins').innerText = playerState.coins;
                syncToCloud();
                alert("🎉 Mission Success! +550 Coins added to your worldwide vault!");
                window.location.href = "room-youth.html";
            };
        }

        function chooseFight() {
            playerState.triesRemaining--;
            speakText("Mission failed! The traveler is overpowered by the Level 3 wolf.");
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'mission-fail.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();
            videoElement.onended = function() {
                document.getElementById('ui-tries').innerText = playerState.triesRemaining + ' / 2';
                document.getElementById('overlay-dialogue-content').innerHTML = `
                    <p style="color: #ff6b6b; font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                        ❌ Mission Failed! Tries left: ${playerState.triesRemaining}.
                    </p>
                    <div class="choice-btn-group">
                        <button class="royal-btn" onclick="location.reload()">🔄 Try Again</button>
                    </div>
                `;
                syncToCloud();
            };
        }

        function declineQuest() {
            speakText("May the road treat you well, traveler.");
            alert("Quest declined.");
        }
    </script>
</body>
</html>
