<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help a Traveler — Village of Ikmid | Imperial Divine Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs for Worldwide Cloud Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @keyframes imperialSilkWave {
            0% { background-position: 0% 50%; filter: brightness(1); }
            50% { background-position: 100% 50%; filter: brightness(1.1); }
            100% { background-position: 0% 50%; filter: brightness(1); }
        }

        @keyframes emeraldRuneShimmer {
            0% { box-shadow: 0 0 8px rgba(121,255,230,0.5); border-color: rgba(121,255,230,0.7); background: rgba(121,255,230,0.12); }
            50% { box-shadow: 0 0 25px rgba(121,255,230,0.95); border-color: #79ff9c; background: rgba(121,255,156,0.25); }
            100% { box-shadow: 0 0 8px rgba(121,255,230,0.5); border-color: rgba(121,255,230,0.7); background: rgba(121,255,230,0.12); }
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.8); opacity: 1; color: #79ff9c; }
            100% { transform: translateY(-55px) scale(1.2); opacity: 0; color: #79ffe6; }
        }

        :root {
            --panel-bg: rgba(10, 18, 15, 0.95);
            --theme-color: #79ffe6;
            --text-main: #f5f2eb;
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #051912, #002b3d, #0b1d3a, #1a082e);
            background-size: 400% 400%;
            animation: imperialSilkWave 18s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav { 
            padding: 12px 20px; 
            background: var(--panel-bg);
            border-bottom: 2px solid var(--theme-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        nav a { color: var(--text-main); text-decoration: none; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; cursor: pointer; }
        nav a:hover { color: var(--theme-color); }

        .cinematic-stage {
            position: relative;
            width: 96%;
            max-width: 1400px;
            height: 68vh;
            min-height: 420px;
            margin: 15px auto;
            border: 4px ridge var(--theme-color);
            border-radius: 16px;
            overflow: hidden;
            background: #0b1411;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinematic-stage video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0b1411;
        }

        .video-quest-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(4, 14, 11, 0.96);
            border-top: 2px solid var(--theme-color);
            padding: 14px 20px;
            box-sizing: border-box;
            text-align: center;
            z-index: 20;
        }

        .village-hud {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 45, 28, 0.9);
            border: 1px solid var(--theme-color);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .village-hud span { color: #79ffe6; font-weight: bold; }

        .royal-btn {
            background: linear-gradient(to bottom, #00b4d8, #0077b6);
            color: #fff;
            border: 1px solid #79ffe6;
            padding: 10px 22px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            display: inline-block;
            margin: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }
        .royal-btn:hover { background: #79ffe6; color: #0b0f0e; box-shadow: 0 0 20px #79ffe6; }

        .gathering-hotspot {
            position: absolute;
            width: 75px;
            height: 50px;
            border: 2px solid rgba(121, 255, 230, 0.85);
            border-radius: 8px;
            cursor: pointer;
            z-index: 50;
            animation: emeraldRuneShimmer 1.8s infinite ease-in-out;
            display: none;
            background: rgba(121, 255, 230, 0.15);
        }
        .gathering-hotspot:hover { border-color: #79ff9c; transform: scale(1.1); }

        .floating-popup {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 100;
            pointer-events: none;
            animation: floatUpAndFade 1s ease-out forwards;
        }

        .sync-bar {
            margin: 6px auto;
            text-align: center;
        }
        .sync-bar input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--theme-color);
            background: rgba(0,0,0,0.7);
            color: white;
            font-family: 'Cinzel', serif;
            width: 240px;
        }
    </style>
</head>
<body onload="initTravelerExperience()">

    <audio id="click-sound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

    <nav> 
        <a href="room-youth.html" onclick="playClick()">🏛️ Hub Menu</a>
        <a href="map.html" onclick="playClick()">🗺️ World Map</a>
        <a href="shop.html" onclick="playClick()">🛒 Market Stalls</a>
        <a href="help-traveler.html" style="color: var(--theme-color);" onclick="playClick()">🤝 Help a Traveler</a>
    </nav>

    <h1 style="color: var(--theme-color); font-size: 1.7rem; margin: 10px 0 2px 0; text-align: center;">Help a Traveler — Village of Ikmid</h1>
    
    <div class="sync-bar">
        <input type="email" id="userEmailSync" placeholder="Enter email for sync..." onchange="updatePlayerEmail()">
        <button class="royal-btn" onclick="playClick(); syncToCloud();" style="padding: 6px 12px; font-size: 0.75rem;">☁️ Sync Cloud</button>
        <span id="syncStatus" style="font-size: 0.8rem; color: #ffd700; margin-left: 6px;"></span>
    </div>

    <div class="cinematic-stage" id="stage-container">
        <!-- Main Video Element -->
        <video id="traveler-video" autoplay playsinline controls>
            <source src="village-plea.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Gathering Hotspots -->
        <div id="hotspot-container">
            <div class="gathering-hotspot" id="spot-apple" style="top: 18% !important; left: 72% !important;" onclick="playClick(); gatherItem('Apples', 0.1, this, '🍎 +0.1 Apple')" title="Gather Apple"></div>
            <div class="gathering-hotspot" id="spot-herb" style="top: 70% !important; left: 40% !important;" onclick="playClick(); gatherItem('Glowing Herbs', 0.1, this, '🌿 +0.1 Herb')" title="Gather Herb"></div>
            <div class="gathering-hotspot" id="spot-coin" style="top: 78% !important; left: 65% !important;" onclick="playClick(); gatherItem('Gold Coins', 1, this, '🪙 +1 Coin')" title="Collect Coins"></div>
            <div class="gathering-hotspot" id="spot-wood" style="top: 58% !important; left: 18% !important;" onclick="playClick(); gatherItem('Wood Sticks', 0.1, this, '🪵 +0.1 Wood')" title="Gather Wood"></div>
        </div>

        <div class="video-quest-overlay" id="quest-overlay-bar">
            <div class="village-hud">
                <div>Rank: <span id="ui-level">Level 1</span></div>
                <div>Wallet: <span id="ui-coins">550</span> 🪙</div>
                <div>Supplies Score: <span id="ui-score">0.0</span> / 3.0 🌿</div>
            </div>
            
            <div id="overlay-dialogue-content">
                <p id="spokenDialogue" style="color: var(--theme-color); font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                    "Our village traveler pleads for assistance. Do you accept this mission?"
                </p>
                <div class="choice-btn-group" id="actionButtonContainer">
                    <button class="royal-btn" onclick="playClick(); acceptQuest();">✓ Accept Quest</button>
                    <button class="royal-btn" onclick="playClick(); declineQuest();" style="background: linear-gradient(to bottom, #cc0000, #660000);">✗ Decline</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function playClick() {
            let sound = document.getElementById('click-sound');
            if (sound) { sound.currentTime = 0; sound.play().catch(e => {}); }
        }

        let playerState = {
            email: localStorage.getItem('imperial_user_email') || 'traveler@imperial.vision',
            coins: 550,
            score: 0.0,
            currentStage: 'plea'
        };

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.95;
                setTimeout(() => window.speechSynthesis.speak(utterance), 250);
            }
        }

        function initTravelerExperience() {
            document.getElementById('userEmailSync').value = playerState.email;
            speakText("Help a traveler. Our village traveler pleads for assistance. Do you accept this mission?");
        }

        function updatePlayerEmail() {
            let inputEmail = document.getElementById('userEmailSync').value.trim();
            if (inputEmail && inputEmail.includes('@')) {
                playerState.email = inputEmail;
                localStorage.setItem('imperial_user_email', inputEmail);
            }
        }

        function syncToCloud() {
            updatePlayerEmail();
            localStorage.setItem('imperial_user_' + playerState.email, JSON.stringify(playerState));
            document.getElementById('syncStatus').innerText = "✅ Saved!";
        }

        function acceptQuest() {
            let briefing = "Quest accepted. Entering the Whispering Woods. Watch the video and collect supplies continuously.";
            speakText(briefing);

            playerState.currentStage = 'part1';
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'save-collection-part1.mp4';[cite: 7]
            videoElement.load();
            videoElement.play().catch(e => console.log("Autoplay restriction"));

            // Let Part 1 play completely to the end
            videoElement.onended = function() {
                if (playerState.score >= 3.0) {
                    showStageTwoButton();
                } else {
                    speakText("Video finished, but you need more supplies! Replaying Part 1 to gather more.");
                    videoElement.play();
                }
            };

            // Show gathering hotspots during video playback
            document.querySelectorAll('.gathering-hotspot').forEach(spot => spot.style.display = 'block');

            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p style="color: var(--theme-color); font-family: 'Playfair Display', serif; font-style: italic; margin: 0; font-size: 0.9rem;">
                    "Part 1 Playing: Watch the video and click the shimmering square zones repeatedly to gather supplies!"
                </p>
            `;
        }

        function gatherItem(itemType, amount, element, popupText) {
            let rect = element.getBoundingClientRect();
            let stageRect = document.getElementById('stage-container').getBoundingClientRect();
            let popup = document.createElement('div');
            popup.className = 'floating-popup';
            popup.innerText = popupText;
            popup.style.left = (rect.left - stageRect.left + 10) + 'px';
            popup.style.top = (rect.top - stageRect.top - 10) + 'px';
            document.getElementById('stage-container').appendChild(popup);
            setTimeout(() => popup.remove(), 1000);

            // Temporarily hide hotspot and respawn for more clicking
            element.style.display = 'none';
            setTimeout(() => { element.style.display = 'block'; }, 2000);

            playerState.score = parseFloat((playerState.score + amount).toFixed(1));
            document.getElementById('ui-score').innerText = playerState.score.toFixed(1);

            if (itemType === 'Gold Coins') {
                playerState.coins += 10;
                document.getElementById('ui-coins').innerText = playerState.coins;
            }

            syncToCloud();

            // If score reaches quota and video has ended (or is ready)
            if (playerState.score >= 3.0) {
                let vid = document.getElementById('traveler-video');
                if (vid.ended) {
                    showStageTwoButton();
                }
            }
        }

        function showStageTwoButton() {
            document.querySelectorAll('.gathering-hotspot').forEach(spot => spot.style.display = 'none');
            speakText("Part One complete! You have gathered enough supplies. Click Continue to Stage Two.");
            
            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p style="color: #79ffe6; font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                    ✨ Part 1 Complete! Gear and provisions secure.
                </p>
                <div class="choice-btn-group">
                    <button class="royal-btn" onclick="playClick(); startStageTwo();">▶ Continue to Stage 2</button>
                </div>
            `;
        }

        function startStageTwo() {
            speakText("Proceeding to Stage Two. Traveling deeper into the Whispering Woods.");
            playerState.currentStage = 'part2';
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'save-collection-part2.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();

            // Keep hotspots active during Part 2 for extra personal supplies
            document.querySelectorAll('.gathering-hotspot').forEach(spot => spot.style.display = 'block');

            videoElement.onended = function() {
                triggerWolfChoice();
            };

            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p style="color: var(--theme-color); font-family: 'Playfair Display', serif; font-style: italic; margin: 0; font-size: 0.9rem;">
                    "Stage Two Playing: Continue collecting bonus supplies while traveling deeper..."
                </p>
            `;
        }

        function triggerWolfChoice() {
            document.querySelectorAll('.gathering-hotspot').forEach(spot => spot.style.display = 'none');
            speakText("An armored wolf approaches on the path! What is your choice? Stay hiding or fight?");
            
            document.getElementById('overlay-dialogue-content').innerHTML = `
                <p style="color: #ff8585; font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                    ⚠️ An armored wolf blocks the path! Make your tactical choice:
                </p>
                <div class="choice-btn-group">
                    <button class="royal-btn" onclick="playClick(); chooseHide();" style="background: linear-gradient(to bottom, #1b5e20, #0a2e0e);">🛡️ Stay Hiding (Safe)</button>
                    <button class="royal-btn" onclick="playClick(); chooseFight();" style="background: linear-gradient(to bottom, #cc0000, #660000);">⚔️ Fight the Wolf</button>
                </div>
            `;
        }

        function chooseHide() {
            speakText("Mission success! Returning safely to the village.");
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'mission-success.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();
            videoElement.onended = function() {
                alert("🎉 Mission Success! Riches secured.");
                window.location.href = "room-youth.html";
            };
        }

        function chooseFight() {
            speakText("Mission failed! The wolf overpowered the adventurer.");
            const videoElement = document.getElementById('traveler-video');
            videoElement.src = 'mission-fail.mp4';[cite: 7]
            videoElement.load();
            videoElement.play();
            videoElement.onended = function() {
                document.getElementById('overlay-dialogue-content').innerHTML = `
                    <p style="color: #ff6b6b; font-family: 'Playfair Display', serif; font-style: italic; margin: 0 0 6px 0; font-size: 0.95rem;">
                        ❌ Mission Failed!
                    </p>
                    <div class="choice-btn-group">
                        <button class="royal-btn" onclick="playClick(); location.reload();">🔄 Try Again</button>
                    </div>
                `;
            };
        }

        function declineQuest() {
            speakText("May the road treat you well, traveler.");
            alert("Quest declined.");
        }
    </script>
</body>
</html>
