<script>
        let musicStarted = false;

        function shineLight(event) {
            let layer = document.getElementById('shine-layer');
            let x = (event.clientX / window.innerWidth) * 100;
            let y = (event.clientY / window.innerHeight) * 100;
            layer.style.background = "radial-gradient(circle at " + x + "% " + y + "%, rgba(212, 175, 55, 0.3) 0%, transparent 60%)";
            layer.style.opacity = "1";

            if (!musicStarted) {
                let audio = document.getElementById('peaceful-melody');
                if (audio) {
                    audio.volume = 0.4;
                    audio.play().then(() => {
                        musicStarted = true;
                    }).catch(e => {});
                }
            }
        }

        function playMelody() {
            let audio = document.getElementById('peaceful-melody');
            if (audio && !musicStarted) {
                audio.volume = 0.4;
                audio.play().then(() => {
                    musicStarted = true;
                }).catch(e => {});
            }
        }

        function openModal() {
            document.getElementById('communityModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('communityModal').style.display = 'none';
        }

        function routeByBirthday() {
            let bdayInput = document.getElementById('user-birthday').value.trim();
            if (!bdayInput) {
                alert("Please enter your date of birth.");
                return;
            }

            // Extract the year from the input (supports MM/DD/YYYY or just entering a year)
            let parts = bdayInput.split(/[\/\-\.]/);
            let year = parseInt(parts[parts.length - 1]);

            if (isNaN(year) || year < 1900 || year > 2026) {
                alert("Please enter a valid date format (e.g., MM/DD/YYYY).");
                return;
            }

            let currentYear = 2026;
            let age = currentYear - year;

            // Accurate Room Routing based on Age Brackets
            if (age < 13) {
                alert("Kids credentials recognized. Routing to Kids Room...");
                window.location.href = "kids-room.html";
            } else if (age >= 13 && age <= 19) {
                alert("Youth credentials recognized. Routing to Youth Room & Proving Grounds...");
                window.location.href = "proving-grounds.html";
            } else if (age >= 20 && age <= 64) {
                alert("Adult credentials recognized. Routing to Adult Room, Wardrobe & Likeness Creator...");
                window.location.href = "wardrobe.html"; // Change to your exact adult room / wardrobe file name if needed
            } else {
                alert("Elder credentials recognized. Routing to Elder Sanctuary...");
                window.location.href = "elder-room.html";
            }
        }
    </script>
</body>
</html>
