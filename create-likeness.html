<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Divine Vision: Likeness Chamber</title>
    <style>
        :root {
            --bg-dark: #0c0b0a;
            --panel-bg: rgba(22, 19, 16, 0.95);
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-main: #f5f2eb;
            --text-muted: #9e9382;
            --vip-color: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Sparkling, Breathing, Multi-Color Dynamic Reflective Background */
        .ambient-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(135deg, #120f14, #0c0b0a, #161219);
            background-size: 400% 400%;
            animation: backgroundShift 15s ease infinite alternate;
        }

        @keyframes backgroundShift {
            0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
            33% { background-position: 100% 0%; filter: hue-rotate(40deg); }
            66% { background-position: 50% 100%; filter: hue-rotate(80deg); }
            100% { background-position: 0% 50%; filter: hue-rotate(120deg); }
        }

        /* Floating Sparkles & Light Orbs */
        .sparkle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(135, 206, 250, 0.35) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 218, 185, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(152, 251, 152, 0.3) 0%, transparent 40%);
            animation: orbBreathe 8s ease-in-out infinite alternate;
        }

        @keyframes orbBreathe {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.08); opacity: 1; filter: brightness(1.2); }
            100% { transform: scale(1); opacity: 0.7; }
        }

        /* Top Bar */
        .game-top-bar {
            height: 48px;
            background: linear-gradient(90deg, #14110e 0%, #1f1a14 50%, #14110e 100%);
            border-bottom: 1.5px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .game-top-bar .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .game-top-bar a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .game-top-bar a:hover {
            color: var(--gold-hover);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        .game-top-bar span.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .wardrobe-nav-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid var(--gold);
            color: var(--gold) !important;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wardrobe-nav-btn:hover {
            background: var(--gold);
            color: var(--bg-dark) !important;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.8);
            transform: translateY(-1px);
        }

        /* Main Spacious Layout */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            box-sizing: border-box;
            z-index: 2;
        }

        /* Featured Active Viewport Section with Glowing, Reflective Frame */
        .featured-section {
            display: flex;
            gap: 30px;
            background: rgba(22, 19, 16, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(255, 182, 193, 0.25), inset 0 0 20px rgba(135, 206, 250, 0.15);
            align-items: center;
            animation: frameGlowPulse 5s ease-in-out infinite alternate;
        }

        @keyframes frameGlowPulse {
            0% { border-color: #d4af37; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 25px rgba(255, 182, 193, 0.25); }
            50% { border-color: #ffb6c1; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(135, 206, 250, 0.4); }
            100% { border-color: #87cefa; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 218, 185, 0.35); }
        }

        .featured-viewport {
            flex: 1;
            max-width: 480px;
            height: 520px;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 25px rgba(212, 175, 55, 0.3);
        }

        .avatar-preview-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
            animation: cardGlow 4s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% { filter: drop-shadow(0 0 8px rgba(255, 182, 193, 0.3)); }
            50% { filter: drop-shadow(0 0 15px rgba(135, 206, 250, 0.4)); }
            100% { filter: drop-shadow(0 0 8px rgba(255, 218, 185, 0.3)); }
        }

        .featured-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .character-name-title {
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 12px rgba(255, 182, 193, 0.4);
            margin: 0;
        }

        .character-role-desc {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-style: italic;
            letter-spacing: 1px;
        }

        .outfit-section {
            background: rgba(20, 17, 14, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            color: var(--gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .outfit-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .outfit-btn {
            background: #221d17;
            border: 1px solid #4a3f31;
            color: var(--text-main);
            padding: 10px 16px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        .outfit-btn:hover {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .outfit-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: bold;
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
        }

        .outfit-btn.vip {
            border-color: var(--vip-color);
            color: var(--vip-color);
        }

        .outfit-btn.vip.active {
            background: var(--vip-color);
            color: var(--bg-dark);
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.9);
        }

        .vip-banner {
            display: none;
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.25), rgba(255, 182, 193, 0.15));
            border: 1px dashed var(--vip-color);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .vip-banner p {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: var(--vip-color);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
        }

        .cashapp-btn {
            background: #00D632;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,214,50,0.5);
            transition: transform 0.2s ease;
        }

        .cashapp-btn:hover {
            transform: scale(1.03);
            background: #00b82b;
            box-shadow: 0 0 20px rgba(0,214,50,0.8);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .game-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 12px 24px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: var(--gold-hover);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.9);
            transform: translateY(-1px);
        }

        /* Spacious Imperial Character Directory Grid with Sparkling Glow Cards */
        .directory-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .character-card {
            background: rgba(22, 19, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #3a3227;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .character-card:hover, .character-card.selected {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 20px rgba(255, 182, 193, 0.35);
            background: rgba(31, 26, 20, 0.95);
        }

        .card-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .card-name {
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-role {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Sparkling, Breathing, Reflective Background Layers -->
    <div class="ambient-background"></div>
    <div class="sparkle-overlay"></div>

    <div class="game-top-bar">
        <div class="nav-links">
            <a href="gateway.html">Imperial Gateway</a>
            <span class="active">Likeness Chamber</span>
        </div>
        <div>
            <a href="room-adult.html" class="wardrobe-nav-btn">✦ Sovereign Wardrobe</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Featured Active Character Viewport & Controls -->
        <div class="featured-section">
            <div class="featured-viewport">
                <div id="media-frame" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
                    <!-- Dynamic Media -->
                </div>
            </div>
            
            <div class="featured-details">
                <div>
                    <h1 id="char-name" class="character-name-title">Queen Rosanna</h1>
                    <div id="char-role" class="character-role-desc">The Imperial Queen | Sovereign Path</div>
                </div>

                <div class="outfit-section">
                    <div class="panel-title">Select Style / Attire</div>
                    <div class="outfit-buttons" id="outfit-buttons">
                        <!-- Dynamic outfit buttons -->
                    </div>
                </div>

                <div id="vip-banner" class="vip-banner">
                    <p>✦ VIP Exclusive Style ($1.45) ✦</p>
                    <a id="cashapp-link" href="https://cash.app/$tegrakij22/1.45" target="_blank" class="cashapp-btn">Unlock via Cash App ($tegrakij22)</a>
                </div>

                <div class="action-buttons">
                    <button class="game-btn" onclick="startStoryPath()">Begin Story Path</button>
                    <a href="gateway.html" class="game-btn" style="background: transparent; color: var(--gold); border: 1px solid var(--gold);">Return to Gateway</a>
                </div>
            </div>
        </div>

        <!-- Spacious Character Directory Grid -->
        <div class="directory-section">
            <div class="panel-title">Imperial Palace Characters Directory</div>
            <div class="directory-grid" id="character-grid">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        const characters = [
            {
                id: "rosanna",
                name: "Queen Rosanna",
                role: "The Imperial Queen (Hero Path)",
                path: "sovereign-path.html",
                outfits: [
                    { name: "Sovereign Robe", file: "rosanna-best-CINEMATIC.mp4", vip: false },
                    { name: "Imperial Purple", file: "rosanna-purple-CINEMATIC.mp4", vip: false },
                    { name: "Imperial Green", file: "rosanna-green-CINEMATIC.mp4", vip: false },
                    { name: "Pink Cinematic (VIP)", file: "rosanna-pink-CINEMATIC.mp4", vip: true }
                ]
            },
            {
                id: "benson",
                name: "King Benson",
                role: "Sovereign Provider & King (Hero Path)",
                path: "sovereign-path.html",
                outfits: [
                    { name: "Imperial King", file: "king-benson-imperial-CINEMATIC.mp4", vip: false },
                    { name: "Sword Guardian", file: "king-benson-sword-cinematic.mp4", vip: false },
                    { name: "Wave Cinematic (VIP)", file: "king-benson-wave-CINEMATIC.mp4", vip: true }
                ]
            },
            {
                id: "weka",
                name: "Consort Weka",
                role: "Keeper of the Temple",
                path: "temple-path.html",
                outfits: [
                    { name: "Style 1", file: "imperial-consort-weka-1-cinematic.mp4", vip: false },
                    { name: "Style 2", file: "imperial-consort-weka-2-CINEMATIC.mp4", vip: false },
                    { name: "VIP Style 3", file: "imperial-consort-weka-3-cinematic.mp4", vip: true }
                ]
            },
            {
                id: "resekelishi",
                name: "Resekelishi",
                role: "Temple Villain Path (Survive & Scheme)",
                path: "villain-redemption-path.html",
                outfits: [
                    { name: "Style 1", file: "resekelishi-villain-CINEMATIC.mp4", vip: false },
                    { name: "Style 4", file: "resekelishi-villian-4-cinematic.mp4", vip: false },
                    { name: "VIP Style 5", file: "resekelishi-villian-5-cinematic.png", vip: true }
                ]
            },
            {
                id: "rika",
                name: "Concubine Rika",
                role: "Imperial Console",
                path: "empire-path.html",
                outfits: [
                    { name: "Style 1", file: "concubine-rika-1-cinematic.mp4", vip: false },
                    { name: "Style 2", file: "comcubine-rika-2-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "tiju",
                name: "Concubine Tiju",
                role: "Guardian of the Gate",
                path: "gate-path.html",
                outfits: [
                    { name: "Style 1", file: "comcubine-tiju-1-cinematic.mp4", vip: false },
                    { name: "Style 2", file: "comcubine-tiju-2-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "highpriest",
                name: "High Priest",
                role: "Temple Authority",
                path: "temple-path.html",
                outfits: [
                    { name: "Style 1", file: "high-priest-1-cinematic.mp4", vip: false },
                    { name: "Style 2", file: "high-priest-2-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "commander",
                name: "Imperial Commander",
                role: "Military & Defense",
                path: "sovereign-path.html",
                outfits: [
                    { name: "Commander Attire", file: "imperial-commander-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "guard",
                name: "Imperial Guard",
                role: "Palace Protection",
                path: "sovereign-path.html",
                outfits: [
                    { name: "Guard Uniform", file: "imperial-guard-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "versta",
                name: "Grand Consort Versta",
                role: "Inner Court",
                path: "empire-path.html",
                outfits: [
                    { name: "Versta Attire", file: "imperial-grand-consort-versta-2-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "treasury",
                name: "Minister of Treasury",
                role: "Imperial Wealth",
                path: "empire-path.html",
                outfits: [
                    { name: "Treasury Robes", file: "minister-treasure-cinematic.mp4", vip: false }
                ]
            },
            {
                id: "prophet",
                name: "Prophet Kafura",
                role: "Divine Visionary",
                path: "temple-path.html",
                outfits: [
                    { name: "Prophet Robes", file: "prophet-kafura-1-cinematic.mp4", vip: false }
                ]
            }
        ];

        let selectedCharacter = characters[0];
        let selectedOutfitIndex = 0;

        function buildCharacterGrid() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            characters.forEach((char) => {
                const card = document.createElement('div');
                card.className = 'character-card' + (char === selectedCharacter ? ' selected' : '');
                
                const thumbFile = char.outfits[0].file;
                const isVideo = thumbFile.endsWith('.mp4');

                card.innerHTML = `
                    ${isVideo ? `<video class="card-thumb" autoplay loop muted src="${thumbFile}"></video>` : `<img class="card-thumb" src="${thumbFile}">`}
                    <div class="card-name">${char.name}</div>
                    <div class="card-role">${char.role}</div>
                `;
                card.onclick = () => {
                    selectedCharacter = char;
                    selectedOutfitIndex = 0;
                    buildCharacterGrid();
                    updateDisplay();
                    buildOutfitButtons();
                };
                grid.appendChild(card);
            });
        }

        function buildOutfitButtons() {
            const container = document.getElementById('outfit-buttons');
            container.innerHTML = '';

            selectedCharacter.outfits.forEach((outfit, idx) => {
                const btn = document.createElement('button');
                btn.className = 'outfit-btn' + (outfit.vip ? ' vip' : '') + (idx === selectedOutfitIndex ? ' active' : '');
                btn.textContent = outfit.name;
                btn.onclick = () => {
                    selectedOutfitIndex = idx;
                    document.querySelectorAll('.outfit-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateDisplay();
                };
                container.appendChild(btn);
            });
        }

        function updateDisplay() {
            const outfit = selectedCharacter.outfits[selectedOutfitIndex];
            const mediaFrame = document.getElementById('media-frame');
            
            if (outfit.file.endsWith('.mp4')) {
                mediaFrame.innerHTML = `
                    <video class="avatar-preview-media" autoplay loop muted playsinline>
                        <source src="${outfit.file}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
            } else {
                mediaFrame.innerHTML = `
                    <img class="avatar-preview-media" src="${outfit.file}" alt="${selectedCharacter.name}">
                `;
            }

            document.getElementById('char-name').textContent = selectedCharacter.name;
            document.getElementById('char-role').textContent = selectedCharacter.role;

            const vipBanner = document.getElementById('vip-banner');
            if (outfit.vip) {
                vipBanner.style.display = 'block';
                document.getElementById('cashapp-link').href = `https://cash.app/$tegrakij22/1.45`;
            } else {
                vipBanner.style.display = 'none';
            }
        }

        function startStoryPath() {
            window.location.href = selectedCharacter.path;
        }

        // Initialize Chamber
        buildCharacterGrid();
        buildOutfitButtons();
        updateDisplay();
    </script>
</body>
</html>
