<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Youth Hub — Imperial Divine Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        @keyframes imperialSilkShift {
            0% { background: linear-gradient(135deg, #061a14 0%, #0b0f0e 40%, #10081d 70%, #041018 100%); filter: brightness(1); }
            50% { background: linear-gradient(135deg, #0b261e 0%, #140c22 40%, #061822 70%, #081612 100%); filter: brightness(1.12); }
            100% { background: linear-gradient(135deg, #061a14 0%, #0b0f0e 40%, #10081d 70%, #041018 100%); filter: brightness(1); }
        }

        :root {
            --panel-bg: rgba(10, 18, 15, 0.94);
            --theme-color: #79ffe6;
            --text-main: #f5f2eb;
            --text-muted: #c5b59b;
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: imperialSilkShift 18s ease-in-out infinite alternate;
            text-align: center;
        }

        .hub-container {
            background: var(--panel-bg);
            border: 4px ridge var(--theme-color);
            padding: 40px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--theme-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(121,255,230,0.5);
        }

        p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .royal-btn {
            background: linear-gradient(to bottom, #00b4d8, #0077b6);
            color: #fff;
            border: 1px solid var(--theme-color);
            padding: 14px 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .royal-btn:hover {
            background: var(--theme-color);
            color: #0b0f0e;
            box-shadow: 0 0 25px var(--theme-color);
            transform: translateY(-2px);
        }

        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>Room Youth Hub</h1>
        <p>Welcome, Guardian. Select your destination within the Imperial Sanctuary.</p>
        
        <div class="menu-grid">
            <a href="help-traveler.html" class="royal-btn full-width">🤝 Help a Traveler (Quest Gate)</a>
            <a href="map.html" class="royal-btn">🗺️ World Map</a>
            <a href="shop.html" class="royal-btn">🛒 Market Stalls</a>
            <a href="village.html" class="royal-btn">🏛️ Guild Chambers</a>
            <a href="library.html" class="royal-btn">📚 Imperial Library</a>
        </div>
    </div>

</body>
</html>
