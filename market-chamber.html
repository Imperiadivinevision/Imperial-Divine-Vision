<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Market Chamber - Victory Project</title>
    <style>
        :root {
            --primary-blue: #1a365d;
            --accent-pink: #d53f8c;
            --gold: #d69e2e;
            --sand: #f7fafc;
            --dark-wood: #2c1810;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-wood);
            color: var(--sand);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: rgba(0, 0, 0, 0.7);
            width: 100%;
            padding: 15px 0;
            text-align: center;
            border-bottom: 3px solid var(--gold);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .market-container {
            display: flex;
            flex-direction: column;
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            background: #3d2314;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 2px solid #5c3a21;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: contain;
        }

        /* Interactive Clickable Hotspot Squares over Video Items */
        .hotspot {
            position: absolute;
            border: 2px dashed var(--gold);
            background: rgba(214, 158, 46, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        .hotspot:hover {
            background: rgba(214, 158, 46, 0.5);
            border-color: #fff;
            transform: scale(1.03);
        }

        .shop-controls {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c1810;
            border-top: 2px solid #5c3a21;
        }

        .player-wallet {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
        }

        .video-selector {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2b4c8c;
        }

        /* Purchase Modal / Popup Overlay */
        #purchase-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #4a2818;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid var(--gold);
            text-align: center;
            max-width: 350px;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .modal-content h3 {
            color: var(--gold);
            margin-top: 0;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-buy {
            background-color: #276749;
        }
        .btn-buy:hover {
            background-color: #2f855a;
        }
        .btn-cancel {
            background-color: #9b2c2c;
        }
        .btn-cancel:hover {
            background-color: #c53030;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Grand Market Chamber</h1>
    </header>

    <div class="market-container">
        <div class="video-wrapper">
            <!-- Video element loading your registered market videos -->
            <video id="marketVideo" controls autoplay muted>
                <source src="market-1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- Dynamic Clickable Hotspots overlayed on video items -->
            <div id="hotspot-container"></div>
        </div>

        <div class="shop-controls">
            <div class="player-wallet">
                🪙 Coins: <span id="coin-count">10</span> Copper
            </div>
            <div class="video-selector">
                <button class="btn" onclick="switchVideo('market-1.mp4', 'general')">Overview</button>
                <button class="btn" onclick="switchVideo('market-2.mp4', 'fountain')">Fountain</button>
                <button class="btn" onclick="switchVideo('market-3.mp4', 'fish')">Fish Stall</button>
                <button class="btn" onclick="switchVideo('market-4.mp4', 'smith')">Blacksmith</button>
                <button class="btn" onclick="switchVideo('market-5.mp4', 'bakery')">Bakery & Fabric</button>
            </div>
        </div>
    </div>

    <!-- Purchase Confirmation Modal -->
    <div id="purchase-modal">
        <div class="modal-content">
            <h3 id="item-title">Item Name</h3>
            <p id="item-desc">Would you like to purchase this item?</p>
            <p style="color: var(--gold); font-weight: bold;" id="item-price">Cost: 1 Copper</p>
            <div class="modal-buttons">
                <button class="btn btn-buy" onclick="confirmPurchase()">Buy</button>
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Audio element for click/purchase sound effects -->
    <audio id="clickSound" src="https://actions.google.com/sounds/v1/ui/click.ogg"></audio>
    <audio id="coinSound" src="https://actions.google.com/sounds/v1/foley/coins_tinkle.ogg"></audio>

    <script>
        let playerCoins = 10;
        let selectedItem = null;

        const videoItems = {
            'market-1.mp4': [
                { name: "Woven Blanket", price: 3, top: "40%", left: "30%", width: "15%", height: "30%" }
            ],
            'market-2.mp4': [
                { name: "Fresh Produce", price: 1, top: "60%", left: "10%", width: "20%", height: "25%" }
            ],
            'market-3.mp4': [
                { name: "Leaping Fish", price: 1, top: "50%", left: "25%", width: "25%", height: "35%" }
            ],
            'market-4.mp4': [
                { name: "Forged Dagger", price: 4, top: "45%", left: "40%", width: "20%", height: "40%" }
            ],
            'market-5.mp4': [
                { name: "Artisan Bread", price: 1, top: "55%", left: "15%", width: "25%", height: "30%" },
                { name: "Soft Silk Fabric", price: 2, top: "35%", left: "60%", width: "25%", height: "30%" }
            ]
        };

        function switchVideo(videoSrc, locationKey) {
            document.getElementById('clickSound').play();
            const video = document.getElementById('marketVideo');
            video.src = videoSrc;
            video.play();
            renderHotspots(videoSrc);
        }

        function renderHotspots(videoSrc) {
            const container = document.getElementById('hotspot-container');
            container.innerHTML = '';
            
            const items = videoItems[videoSrc] || [];
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'hotspot';
                div.style.top = item.top;
                div.style.left = item.left;
                div.style.width = item.width;
                div.style.height = item.height;
                div.innerHTML = `<span>${item.name} (${item.price}c)</span>`;
                div.onclick = () => openModal(item);
                container.appendChild(div);
            });
        }

        function openModal(item) {
            document.getElementById('clickSound').play();
            selectedItem = item;
            document.getElementById('item-title').innerText = item.name;
            document.getElementById('item-desc').innerText = `Acquire this wonderful item from the market stall.`;
            document.getElementById('item-price').innerText = `Cost: ${item.price} Copper`;
            document.getElementById('purchase-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('purchase-modal').style.display = 'none';
            selectedItem = null;
        }

        function confirmPurchase() {
            if (playerCoins >= selectedItem.price) {
                playerCoins -= selectedItem.price;
                document.getElementById('coin-count').innerText = playerCoins;
                document.getElementById('coinSound').play();
                alert(`Successfully purchased ${selectedItem.name}! Added to your inventory.`);
                closeModal();
            } else {
                alert("You don't have enough copper coins for this item!");
            }
        }

        // Initialize hotspots for the default video on load
        window.onload = () => {
            renderHotspots('market-1.mp4');
        };
    </script>
</body>
</html>
