<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Empire: Arcade Fighting Arena</title>
    <style>
        :root {
            --primary-red: #8B0000;
            --gold: #D4AF37;
            --dark-bg: #050508;
            --card-bg: #121218;
            --text-light: #f4f4f4;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        header {
            text-align: center;
            padding: 8px;
            background: linear-gradient(180deg, #1b1b22, #111);
            border-bottom: 2px solid var(--gold);
        }

        header h1 {
            color: var(--gold);
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            background: #101014;
            padding: 6px;
            gap: 15px;
            border-bottom: 1px solid #222;
            font-size: 0.85rem;
        }

        .nav-bar a {
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
        }

        .arcade-container {
            max-width: 1100px;
            margin: 10px auto;
            background: var(--card-bg);
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .hud-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a24;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .fighter-hud {
            width: 40%;
        }

        .health-bar-frame {
            width: 100%;
            height: 20px;
            background: #222;
            border: 2px solid var(--gold);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }

        #player-hp {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #008855);
            transition: width 0.1s ease;
        }

        #boss-hp {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #8b0000);
            transition: width 0.1s ease;
        }

        #fight-canvas {
            width: 100%;
            height: 400px;
            background: radial-gradient(circle, #1a1528 0%, #08060a 100%);
            border: 2px solid #444;
            border-radius: 8px;
            display: block;
            cursor: crosshair;
        }

        .control-deck {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 12px;
        }

        .fight-btn {
            background: linear-gradient(135deg, var(--primary-red), #400);
            color: white;
            border: 2px solid var(--gold);
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .fight-btn:hover {
            background: linear-gradient(135deg, #b00, var(--primary-red));
            transform: scale(1.05);
        }

        .fight-btn:active {
            transform: scale(0.95);
        }

        .battle-ticker {
            background: #050508;
            border: 1px solid #222;
            padding: 8px;
            height: 45px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #00ffcc;
            border-radius: 4px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body onload="initGame()">

    <header>
        <h1>Sovereign Empire: Arcade Fighting Arena</h1>
    </header>

    <div class="nav-bar">
        <a href="index.html">Sanctuary Home</a>
        <a href="map.html">Empire Map</a>
        <a href="battle.html" style="color: #fff;">Combat Arena</a>
        <a href="market-chamber.html">Royal Market</a>
    </div>

    <div class="arcade-container">
        <div class="hud-arena">
            <div class="fighter-hud">
                <div>PLAYER (King Benson / Sovereign Guardian)</div>
                <div class="health-bar-frame"><div id="player-hp"></div></div>
            </div>
            <div style="font-size: 1.2rem; color: var(--gold); font-weight: bold;">VS</div>
            <div class="fighter-hud" style="text-align: right;">
                <div>REBEL PRIME MINISTER (BOSS)</div>
                <div class="health-bar-frame"><div id="boss-hp"></div></div>
            </div>
        </div>

        <canvas id="fight-canvas" width="1000" height="400"></canvas>

        <div class="control-deck">
            <button class="fight-btn" onclick="playerAttack('slash')">⚔️ Sword Slash (J)</button>
            <button class="fight-btn" onclick="playerAttack('heavy')">🔥 Divine Strike (K)</button>
            <button class="fight-btn" onclick="playerBlock()">🛡️ Block (L)</button>
            <button class="fight-btn" style="background:#333;" onclick="resetMatch()">Restart Match</button>
        </div>

        <div class="battle-ticker" id="ticker">
            [Match Start]: Use buttons or keyboard controls to fight the rebel boss with your characters!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('fight-canvas');
        const ctx = canvas.getContext('2d');

        // Load Character Images (Replace these URLs/filenames with your actual character artwork files)
        const playerImg = new Image();
        playerImg.src = 'king-benson.png'; // Put your character image file name here

        const bossImg = new Image();
        bossImg.src = 'rebel-boss.png'; // Put your boss image file name here

        let player = { x: 150, y: 220, width: 80, height: 110, hp: 100, maxHp: 100, attacking: false, blocking: false };
        let boss = { x: 730, y: 210, width: 90, height: 120, hp: 200, maxHp: 200, attacking: false };
        
        let gameState = "FIGHT"; // FIGHT, WIN, LOSE
        let particles = [];

        function initGame() {
            window.addEventListener('keydown', handleKeyPress);
            requestAnimationFrame(gameLoop);
        }

        function logFight(msg) {
            document.getElementById('ticker').innerText = `> ${msg}`;
        }

        function handleKeyPress(e) {
            if (gameState !== "FIGHT") return;
            if (e.key === 'j' || e.key === 'J') playerAttack('slash');
            if (e.key === 'k' || e.key === 'K') playerAttack('heavy');
            if (e.key === 'l' || e.key === 'L') playerBlock();
        }

        function playerAttack(type) {
            if (gameState !== "FIGHT") return;
            let dmg = type === 'slash' ? 15 : 30;
            player.attacking = true;
            
            setTimeout(() => player.attacking = false, 200);

            if (Math.abs(player.x - boss.x) < 130) {
                boss.hp = Math.max(0, boss.hp - dmg);
                logFight(type === 'slash' ? "King Benson strikes with a direct sword slash!" : "Divine Strike hits the rebel boss hard!");
                createSpark(boss.x + 45, boss.y + 50, '#ffd700');
                checkWinCondition();
            } else {
                logFight("Attack missed! Boss is out of range.");
            }
        }

        function playerBlock() {
            player.blocking = true;
            logFight("Guardian raised shield to block incoming damage!");
            setTimeout(() => player.blocking = false, 600);
        }

        function bossAI() {
            if (gameState !== "FIGHT") return;
            if (Math.random() < 0.03) {
                if (boss.x > player.x + 90) boss.x -= 15;
                else if (boss.x < player.x - 90) boss.x += 15;
                else {
                    boss.attacking = true;
                    setTimeout(() => boss.attacking = false, 300);

                    if (player.blocking) {
                        logFight("Block successful! Incoming rebel attack deflected.");
                    } else {
                        let bDmg = Math.floor(Math.random() * 10) + 5;
                        player.hp = Math.max(0, player.hp - bDmg);
                        logFight(`Rebel boss strikes back! You took ${bDmg} damage.`);
                        createSpark(player.x + 40, player.y + 50, '#ff4d4d');
                        checkWinCondition();
                    }
                }
            }
        }

        function createSpark(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 20,
                    color: color
                });
            }
        }

        function updateUI() {
            document.getElementById('player-hp').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('boss-hp').style.width = `${(boss.hp / boss.maxHp) * 100}%`;
        }

        function checkWinCondition() {
            if (boss.hp <= 0) {
                gameState = "WIN";
                logFight("VICTORY! The rebel forces have been crushed!");
            } else if (player.hp <= 0) {
                gameState = "LOSE";
                logFight("DEFEAT! King Benson fell in battle.");
            }
        }

        function resetMatch() {
            player.hp = player.maxHp;
            boss.hp = boss.maxHp;
            player.x = 150;
            boss.x = 730;
            gameState = "FIGHT";
            logFight("New match started. Fight!");
        }

        function gameLoop() {
            if (gameState === "FIGHT") {
                bossAI();
            }

            // Render Arena Background
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Arena Floor & Pillars
            ctx.fillStyle = "#161222";
            ctx.fillRect(0, 330, canvas.width, 70);
            ctx.strokeStyle = "#D4AF37";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(canvas.width, 330);
            ctx.stroke();

            // Draw Player Character (Image if loaded, fallback rectangle if loading)
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = player.blocking ? "#3399ff" : "#00ffcc";
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // Player Attack Effect
            if (player.attacking) {
                ctx.fillStyle = "#fff";
                ctx.fillRect(player.x + 60, player.y + 30, 60, 12);
            }

            // Draw Boss Character (Image if loaded, fallback rectangle if loading)
            if (bossImg.complete && bossImg.naturalWidth !== 0) {
                ctx.drawImage(bossImg, boss.x, boss.y, boss.width, boss.height);
            } else {
                ctx.fillStyle = "#ff4d4d";
                ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
            }

            // Boss Attack Effect
            if (boss.attacking) {
                ctx.fillStyle = "#ff0";
                ctx.fillRect(boss.x - 50, boss.y + 40, 50, 12);
            }

            // Draw Particles / Sparks
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw Game State Overlays
            if (gameState !== "FIGHT") {
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = gameState === "WIN" ? "#D4AF37" : "#ff4d4d";
                ctx.font = "bold 40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(gameState === "WIN" ? "VICTORY ACHIEVED" : "DEFEAT", canvas.width / 2, canvas.height / 2);
            }

            updateUI();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
