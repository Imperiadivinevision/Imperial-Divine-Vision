<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Capital: Sovereign Wardrobe Gallery</title>
    <style>
        :root {
            --bg-dark: #0c0b0a;
            --panel-bg: rgba(22, 19, 16, 0.95);
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-main: #f5f2eb;
            --text-muted: #9e9382;
            --ambient-glow: rgba(212, 175, 55, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* Top Bar: Glorious, Reflective & Professional */
        .game-top-bar {
            height: 48px;
            background: linear-gradient(90deg, #14110e 0%, #1f1a14 50%, #14110e 100%);
            border-bottom: 1.5px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .game-top-bar .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .game-top-bar a {
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 2px;
        }

        .game-top-bar a:hover {
            color: var(--gold-hover);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }

        .game-top-bar span.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* Glorious Header Link for Create Likeness */
        .create-likeness-nav-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
            border: 1px solid var(--gold);
            color: var(--gold) !important;
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-likeness-nav-btn:hover {
            background: var(--gold);
            color: var(--bg-dark) !important;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.8);
            transform: translateY(-1px);
        }

        .container {
            display: flex;
            flex: 1;
            height: calc(100vh - 48px);
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        /* Breathing & Flowing Cinematic Viewport */
        .character-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, var(--ambient-glow) 0%, #0c0b0a 85%);
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
            animation: backgroundBreathe 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundBreathe {
            0% { background: radial-gradient(circle at 40% 40%, var(--ambient-glow) 0%, #0c0b0a 80%); }
            50% { background: radial-gradient(circle at 60% 60%, var(--ambient-glow) 20%, #0c0b0a 90%); }
            100% { background: radial-gradient(circle at 40% 60%, var(--ambient-glow) 10%, #0c0b0a 85%); }
        }

        @keyframes frameFloat {
            0% { transform: translateY(0); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px var(--ambient-glow); }
            50% { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px var(--ambient-glow); }
            100% { transform: translateY(0); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px var(--ambient-glow); }
        }

        .media-frame {
            width: 100%;
            max-width: 540px;
            height: 82vh;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: frameFloat 6s ease-in-out infinite;
        }

        /* Fully Un-zoomed & Proportional: Shows head to toe completely */
        .avatar-preview-media {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center center;
            display: block;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .media-caption {
            margin-top: 10px;
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            z-index: 10;
        }

        /* Control Sidebar */
        .control-sidebar {
            width: 420px;
            background: var(--panel-bg);
            border-left: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
            box-sizing: border-box;
            z-index: 10;
        }

        .panel-title {
            color: var(--gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 6px;
            margin-top: 5px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .option-card {
            background: #1b1713;
            border: 1px solid #3a3227;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .option-card:hover, .option-card.selected {
            border-color: var(--gold);
            color: var(--text-main);
            background: #26201a;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.4), 0 0 8px rgba(212, 175, 55, 0.3);
            font-weight: bold;
        }

        .wardrobe-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .wardrobe-item {
            background: #1b1713;
            border: 1px solid #3a3227;
            border-radius: 4px;
            padding: 9px 12px;
            text-align: left;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wardrobe-item:hover, .wardrobe-item.selected {
            border-color: var(--gold);
            color: var(--text-main);
            background: #26201a;
            padding-left: 16px;
        }

        .action-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 12px 20px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: var(--gold-hover);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="game-top-bar">
        <div class="nav-links">
            <a href="gateway.html">Imperial Gateway</a>
            <span class="active">Sovereign Wardrobe & Cinematics</span>
        </div>
        <div>
            <a href="create-likeness.html" class="create-likeness-nav-btn">✦ Create Likeness & Choose Character</a>
        </div>
    </div>

    <div class="container">
        <!-- Central Breathing Vertical Viewport (Fully Un-zoomed) -->
        <div class="character-viewport">
            <div class="media-frame" id="media-container">
                <video id="media-video" class="avatar-preview-media" autoplay loop muted controls style="display: block;">
                    <source id="video-source" src="king-benson-imperial-CINEMATIC.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <img id="media-image" class="avatar-preview-media" src="" alt="Royal Wardrobe Asset" style="display: none;">
            </div>
            <div id="media-caption" class="media-caption">king-benson-imperial-CINEMATIC.mp4</div>
        </div>

        <!-- Control Sidebar -->
        <div class="control-sidebar">
            <div class="panel-title">Sovereign Profile</div>
            <div class="option-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="option-card" onclick="setProfile('queen')">Queen</div>
                <div class="option-card selected" onclick="setProfile('king')">King</div>
                <div class="option-card" onclick="setProfile('together')">Together</div>
            </div>

            <div class="panel-title">Wardrobe Chamber (Cinematics First)</div>
            <div class="wardrobe-list" id="wardrobe-list"></div>

            <div class="action-footer">
                <a href="gateway.html" class="game-btn" style="background: transparent; color: var(--gold); border: 1px solid var(--gold);">Return to Gateway</a>
            </div>
        </div>
    </div>

    <script>
        const assets = {
            king: [
                { name: "king-benson-imperial-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-royal-robe-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-step-mother-cinematic.mp4", type: "video" },
                { name: "king-benson-sword-cinematic.mp4", type: "video" },
                { name: "king-benson-white-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-hunting-clothes-meduim-1.png", type: "image" },
                { name: "king-benson-hunting-clothes-meduim.png", type: "image" },
                { name: "king-benson-mother-cinematic.png", type: "image" },
                { name: "king-benson-on-horse-cinematic.png", type: "image" },
                { name: "king-benson-on-horse.png", type: "image" },
                { name: "king-benson-outfit-2.png", type: "image" },
                { name: "king-benson-outfit-6.png", type: "image" },
                { name: "king-benson-outfit-10.png", type: "image" },
                { name: "king-benson-outfit-15.png", type: "image" },
                { name: "king-benson-outift-7-1.png", type: "image" },
                { name: "king-benson-outift-7.png", type: "image" },
                { name: "king-benson-outift-9-1.png", type: "image" },
                { name: "king-benson-outift-9.png", type: "image" },
                { name: "king-benson-outift-12.png", type: "image" },
                { name: "king-benson-queen-rosanna-hop-horse.png", type: "image" }
            ],
            queen: [
                { name: "Queen-rosanna-perfect-gown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-3-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-flower-crown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-best-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-formal-event.cinematic.mp4", type: "video" },
                { name: "rosanna-eagle-cinematic.mp4", type: "video" },
                { name: "rosanna-imperial-cinematic.mp4", type: "video" },
                { name: "rosanna-green-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-imperial-outfit-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-read-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-white-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-flower-crown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-purple-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-relax-green-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-song-of-love-harem.mp4", type: "video" },
                { name: "rosanna-tea-INEMATIC.mp4", type: "video" },
                { name: "rosanna-white-2-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-white-CINEMATIC.mp4", type: "video" },
                { name: "royal-love-story-CINEMATIC.mp4", type: "video" },
                { name: "queen-throne-CINEMATIC-1.mp4", type: "video" }
            ],
            together: [
                { name: "king-queen-moving-carriage-CNEMATIC.mp4", type: "video" },
                { name: "king-queen-same-sky-cinematic.mp4", type: "video" },
                { name: "king-queen-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-purple-CINEMATIC-2.mp4", type: "video" },
                { name: "king-queen-royal-purple-CINEMATIC-5.mp4", type: "video" },
                { name: "king-queen-story-of-love-cinematic.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC.mp4", type: "video" },
                { name: "king-queen-white-CINEMATIC-4.mp4", type: "video" },
                { name: "imperial-royal-wedding-cinematic.mp4", type: "video" },
                { name: "imperial-palace.mp4", type: "video" },
                { name: "imperial-palace-hallway.mp4", type: "video" },
                { name: "imperial-palace-guess-room.mp4", type: "video" },
                { name: "imperial-bedroom.mp4", type: "video" }
            ]
        };

        let currentProfile = 'king';

        function setProfile(profile) {
            currentProfile = profile;
            document.querySelectorAll('.control-sidebar .option-grid .option-card').forEach(c => c.classList.remove('selected'));
            event.target.classList.add('selected');
            loadWardrobeList();
            updateAmbientAura(assets[profile][0].name);
        }

        function loadWardrobeList() {
            const listContainer = document.getElementById('wardrobe-list');
            listContainer.innerHTML = '';
            
            const items = assets[currentProfile];
            if (!items || items.length === 0) return;

            selectMedia(items[0].name, items[0].type);

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'wardrobe-item' + (index === 0 ? ' selected' : '');
                div.textContent = item.name;
                div.onclick = () => {
                    document.querySelectorAll('.wardrobe-item').forEach(i => i.classList.remove('selected'));
                    div.classList.add('selected');
                    selectMedia(item.name, item.type);
                };
                listContainer.appendChild(div);
            });
        }

        function selectMedia(fileName, fileType) {
            const videoElem = document.getElementById('media-video');
            const sourceElem = document.getElementById('video-source');
            const imageElem = document.getElementById('media-image');
            const captionElem = document.getElementById('media-caption');

            captionElem.textContent = fileName;
            updateAmbientAura(fileName);

            if (fileType === 'video') {
                videoElem.style.display = 'block';
                imageElem.style.display = 'none';
                sourceElem.src = fileName;
                videoElem.load();
            } else {
                videoElem.style.display = 'none';
                imageElem.style.display = 'block';
                imageElem.src = fileName;
            }
        }

        function updateAmbientAura(name) {
            let glowColor = "rgba(212, 175, 55, 0.2)";
            if (name.includes('pink') || name.includes('red')) {
                glowColor = "rgba(219, 112, 147, 0.25)";
            } else if (name.includes('purple') || name.includes('royal-purple')) {
                glowColor = "rgba(138, 43, 226, 0.25)";
            } else if (name.includes('green')) {
                glowColor = "rgba(46, 139, 87, 0.25)";
            } else if (name.includes('white')) {
                glowColor = "rgba(240, 248, 255, 0.25)";
            }
            document.documentElement.style.setProperty('--ambient-glow', glowColor);
        }

        loadWardrobeList();
    </script>
</body>
</html>
