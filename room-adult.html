<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Capital: The Sovereign Chambers</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Rich Royal Green, Shiny Orange silk, and Obsidian with intense Gold trim */
            --bg-dark: #030a06;
            --panel-bg: rgba(6, 17, 11, 0.97);
            --gold: #d4af37;
            --gold-hover: #ffdf7e;
            --accent-orange: #ff8c00;
            --text-main: #f5f2eb;
            --text-muted: #a3b8aa;
            --ambient-glow: rgba(212, 175, 55, 0.35);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            box-sizing: border-box;
            background-image: radial-gradient(circle at center, rgba(14, 38, 22, 0.4) 0%, #030a06 90%);
        }

        /* Nav Hub with Imperial Trims */
        nav { 
            padding: 0.8rem 1rem; 
            background: linear-gradient(180deg, #091a10 0%, #040c07 100%);
            border-bottom: 3px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9);
            flex-wrap: wrap;
            backdrop-filter: blur(12px);
            width: 100%;
            box-sizing: border-box;
        }

        nav a { 
            font-family: 'Cinzel', serif;
            color: #f3e5ab; 
            text-decoration: none; 
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px var(--gold), 0 0 20px var(--accent-orange);
        }

        /* Grand Cinematic Sovereign Header */
        .page-banner {
            background: linear-gradient(90deg, transparent 0%, rgba(212, 175, 55, 0.15) 50%, transparent 100%);
            border-bottom: 1px solid var(--gold);
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .page-banner h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .container {
            display: flex;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #0a2515 0%, #030c06 100%);
        }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
        }

        /* Grand Cinematic Viewport (Left & Larger) */
        .character-viewport {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 30px;
            box-sizing: border-box;
            overflow: hidden;
            transition: all 0.4s ease;
            background-image: 
                linear-gradient(rgba(3, 10, 6, 0.8), rgba(3, 10, 6, 0.85)),
                url('imperial-palace.mp4'); /* Will blend beautifully with atmospheric lights */
            background-size: cover;
            background-position: center;
        }

        .container.theater-mode .character-viewport {
            flex: 3;
        }
        .container.theater-mode .control-sidebar {
            width: 340px;
        }

        /* Golden Framed Wrapper - Gold Money & Glory aesthetics */
        .media-frame-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.15);
        }

        /* Beautiful Theater Expand Button */
        .viewport-expand-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #091a10 0%, #040c07 100%);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 8px 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .viewport-expand-btn:hover {
            transform: scale(1.05);
            background: var(--gold);
            color: #030a06;
            box-shadow: 0 0 20px var(--gold);
        }

        /* 3D Royal Decorative frame */
        .media-frame {
            width: 100%;
            height: min(74vh, 680px);
            border: 6px double var(--gold);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 0 0 2px rgba(3, 10, 6, 0.8),
                0 25px 60px rgba(0,0,0,0.95), 
                0 0 45px rgba(212, 175, 55, 0.35);
        }

        .avatar-preview-media {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center center;
            display: block;
            position: relative;
            z-index: 2;
        }

        .media-caption {
            margin-top: 18px;
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-align: center;
            font-family: 'Cinzel', serif;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9), 0 0 10px rgba(212, 175, 55, 0.4);
            z-index: 10;
        }

        /* Control Sidebar (Vault of Wealth) */
        .control-sidebar {
            width: 480px;
            background: var(--panel-bg);
            border-left: 3px solid var(--gold);
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 22px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: -15px 0 35px rgba(0,0,0,0.85);
            transition: width 0.4s ease;
        }

        @media (max-width: 1024px) {
            .control-sidebar { width: 100%; border-left: none; border-top: 3px solid var(--gold); }
        }

        .panel-title {
            color: var(--gold);
            font-size: 0.95rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 10px;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .option-card {
            background: #091a10;
            border: 2px solid #284a37;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .option-card:hover, .option-card.selected {
            border-color: var(--gold);
            color: var(--text-main);
            background: #173627;
            box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.4), 0 0 15px rgba(255, 140, 0, 0.35);
            font-weight: bold;
            transform: translateY(-1px);
        }

        /* Ornate Wardrobe Grid Card */
        .wardrobe-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .wardrobe-card {
            background: #091a10;
            border: 2px solid #284a37;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .wardrobe-card img, .wardrobe-card video {
            width: 100%;
            height: 105px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(212, 175, 55, 0.5);
            background: #000;
        }

        .wardrobe-card span {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .wardrobe-card:hover, .wardrobe-card.selected {
            border-color: var(--accent-orange);
            background: #122a1c;
            box-shadow: 
                0 0 18px rgba(255, 140, 0, 0.5),
                inset 0 0 10px rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
        }

        .wardrobe-card.selected span {
            color: var(--gold-hover);
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255, 140, 0, 0.7);
        }

        .action-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 50%, #875c02 100%);
            color: #030a06;
            border: none;
            padding: 15px 20px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        .game-btn:hover {
            background: linear-gradient(135deg, #ffdf7e, #d4af37, #aa7c11);
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Unified Nav -->
    <nav> 
        <div class="nav-module"><a href="index.html">🏠 Home</a></div>
        <div class="nav-module"><a href="library.html">📚 Library ▾</a></div>
        <div class="nav-module"><a href="battle.html">⚔️ Battle</a></div>
        <div class="nav-module"><a href="proving-grounds.html">🛡️ Youth</a></div>
        <div class="nav-module"><a href="shop.html">🪙 Imperial Shop</a></div>
        <div class="nav-module"><a href="landing.html">🎁 Support Vision</a></div>
        <div class="nav-module"><a href="community.html">💬 Community</a></div>
    </nav>

    <!-- Sovereign Title Banner -->
    <div class="page-banner">
        <h1>THE SOVEREIGN CHAMBERS</h1>
    </div>

    <div class="container" id="mainContainer">
        <!-- Expanded Left-side Sovereign Cinematic Player -->
        <div class="character-viewport">
            <div class="media-frame-wrapper">
                <button class="viewport-expand-btn" id="expandToggleBtn" onclick="toggleTheaterMode()" title="Toggle Theater Fullscreen">
                    <span>Toggle Theater View</span> ⤢
                </button>
                <div class="media-frame" id="media-container">
                    <video id="media-video" class="avatar-preview-media" autoplay loop controls style="display: block;">
                        <source id="video-source" src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <img id="media-image" class="avatar-preview-media" src="" alt="Royal Wardrobe Asset" style="display: none;">
                </div>
            </div>
            <div id="media-caption" class="media-caption">Sovereign View</div>
        </div>

        <!-- Ornate Right-side Controls -->
        <div class="control-sidebar">
            <div class="panel-title">Sovereign Profile</div>
            <div class="option-grid">
                <div class="option-card" onclick="setProfile('queen')">Queen</div>
                <div class="option-card selected" onclick="setProfile('king')">King</div>
                <div class="option-card" onclick="setProfile('together')">Together</div>
            </div>

            <div class="panel-title">
                <span>WARDROBE GALLERY</span>
                <span style="font-size: 0.72rem; color: var(--accent-orange); text-shadow: 0 0 5px var(--accent-orange);">💎 Imperial Vault</span>
            </div>
            <div class="wardrobe-grid" id="wardrobe-list"></div>

            <div class="action-footer">
                <a href="gateway.html" class="game-btn" style="background: transparent; color: var(--gold); border: 2px solid var(--gold); box-shadow: none;">Return to Gateway</a>
            </div>
        </div>
    </div>

    <script>
        const assets = {
            king: [
                { name: "king-benson-imperial-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-royal-robe-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-step-mother-cinematic.mp4", type: "video" },
                { name: "king-benson-sword-cinematic.mp4", type: "video" },
                { name: "king-benson-white-CINEMATIC.mp4", type: "video" },
                { name: "king_benson.png", type: "image" },
                { name: "king_benson-1.png", type: "image" },
                { name: "king_benson-11.png", type: "image" },
                { name: "king-benson-outfit-10.png", type: "image" },
                { name: "king-benson-outfit-15.png", type: "image" },
                { name: "king-benson-outift-7-1.png", type: "image" },
                { name: "king-benson-outift-9.png", type: "image" },
                { name: "king-benson-outift-9-1.png", type: "image" },
                { name: "king-benson-outift-12.png", type: "image" },
                { name: "king-benson-on-horse-cinematic.png", type: "image" },
                { name: "king-benson-on-horse.png", type: "image" },
                { name: "king-benson-hunting-clothes-meduim.png", type: "image" },
                { name: "king-benson-hunting-clothes-meduim-1.png", type: "image" },
                { name: "king-benson-mother-cinematic.png", type: "image" },
                { name: "king-benson-queen-rosanna-hop-horse.png", type: "image" }
            ],
            queen: [
                { name: "Queen-rosanna-perfect-gown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-3-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-flower-crown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-best-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-formal-event.cinematic.mp4", type: "video" },
                { name: "rosanna-eagle-cinematic.mp4", type: "video" },
                { name: "rosanna-imperial-cinematic.mp4", type: "video" },
                { name: "rosanna-green-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-imperial-outfit-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-read-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-white-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-purple-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-relax-green-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-song-of-love-harem.mp4", type: "video" },
                { name: "rosanna-tea-INEMATIC.mp4", type: "video" },
                { name: "rosanna-white-2-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-white-CINEMATIC.mp4", type: "video" },
                { name: "royal-love-story-CINEMATIC.mp4", type: "video" },
                { name: "queen-throne-CINEMATIC-1.mp4", type: "video" }
            ],
            together: [
                { name: "king-queen-moving-carriage-CNEMATIC.mp4", type: "video" },
                { name: "king-queen-same-sky-cinematic.mp4", type: "video" },
                { name: "king-queen-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-purple-CINEMATIC-2.mp4", type: "video" },
                { name: "king-queen-royal-purple-CINEMATIC-5.mp4", type: "video" },
                { name: "king-queen-story-of-love-cinematic.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC.mp4", type: "video" },
                { name: "king-queen-white-CINEMATIC-4.mp4", type: "video" },
                { name: "imperial-royal-wedding-cinematic.mp4", type: "video" },
                { name: "imperial-palace.mp4", type: "video" },
                { name: "imperial-palace-hallway.mp4", type: "video" },
                { name: "imperial-palace-guess-room.mp4", type: "video" },
                { name: "imperial-bedroom.mp4", type: "video" }
            ]
        };

        let currentProfile = localStorage.getItem('imperial_wardrobe_profile') || 'king';

        function toggleTheaterMode() {
            const container = document.getElementById('mainContainer');
            const btn = document.getElementById('expandToggleBtn');
            container.classList.toggle('theater-mode');
            if(container.classList.contains('theater-mode')) {
                btn.innerHTML = '<span>Exit Theater View</span> ⤡';
                btn.title = "Exit Theater Mode";
            } else {
                btn.innerHTML = '<span>Toggle Theater View</span> ⤢';
                btn.title = "Toggle Theater Fullscreen";
            }
        }

        function setProfile(profile) {
            currentProfile = profile;
            localStorage.setItem('imperial_wardrobe_profile', profile);
            
            document.querySelectorAll('.control-sidebar .option-grid .option-card').forEach(c => {
                c.classList.remove('selected');
                if(c.textContent.toLowerCase() === profile) c.classList.add('selected');
            });
            loadWardrobeList();
        }

        function loadWardrobeList() {
            const listContainer = document.getElementById('wardrobe-list');
            listContainer.innerHTML = '';
            
            const items = assets[currentProfile];
            if (!items || items.length === 0) return;

            let lastAsset = localStorage.getItem(`imperial_last_asset_${currentProfile}`) || items[0].name;
            let activeItem = items.find(i => i.name === lastAsset) || items[0];

            selectMedia(activeItem.name, activeItem.type);

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'wardrobe-card' + (item.name === activeItem.name ? ' selected' : '');
                
                if (item.type === 'video') {
                    card.innerHTML = `<video src="${item.name}" muted preload="metadata"></video><span>${item.name.replace(/-CINEMATIC\.mp4|\.mp4/gi, '')}</span>`;
                } else {
                    card.innerHTML = `<img src="${item.name}" alt="asset" loading="lazy"><span>${item.name.replace(/\.png/gi, '')}</span>`;
                }

                card.onclick = () => {
                    document.querySelectorAll('.wardrobe-card').forEach(i => i.classList.remove('selected'));
                    card.classList.add('selected');
                    localStorage.setItem(`imperial_last_asset_${currentProfile}`, item.name);
                    selectMedia(item.name, item.type);
                };
                listContainer.appendChild(card);
            });
        }

        function selectMedia(fileName, fileType) {
            const videoElem = document.getElementById('media-video');
            const sourceElem = document.getElementById('video-source');
            const imageElem = document.getElementById('media-image');
            const captionElem = document.getElementById('media-caption');

            captionElem.textContent = fileName;
            updateAmbientAura(fileName);

            if (fileType === 'video') {
                videoElem.style.display = 'block';
                imageElem.style.display = 'none';
                sourceElem.src = fileName;
                videoElem.load();
            } else {
                videoElem.style.display = 'none';
                imageElem.style.display = 'block';
                imageElem.src = fileName;
            }
        }

        function updateAmbientAura(name) {
            let glowColor = "rgba(212, 175, 55, 0.35)";
            if (name.includes('pink') || name.includes('red')) {
                glowColor = "rgba(255, 140, 0, 0.4)";
            } else if (name.includes('purple') || name.includes('royal-purple')) {
                glowColor = "rgba(138, 43, 226, 0.4)";
            } else if (name.includes('green')) {
                glowColor = "rgba(46, 139, 87, 0.4)";
            } else if (name.includes('white')) {
                glowColor = "rgba(240, 248, 255, 0.4)";
            }
            document.documentElement.style.setProperty('--ambient-glow', glowColor);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setProfile(currentProfile);
        });
    </script>
</body>
</html>
