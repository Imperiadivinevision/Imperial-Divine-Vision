<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Capital: Sovereign Wardrobe Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #06120d;
            --panel-bg: rgba(14, 26, 20, 0.96);
            --gold: #d4af37;
            --gold-hover: #ffdf7e;
            --accent-orange: #ff8c00;
            --text-main: #f5f2eb;
            --text-muted: #a3b8aa;
            --ambient-glow: rgba(212, 175, 55, 0.28);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            box-sizing: border-box;
            transition: background 1.5s ease;
        }

        /* Harmonized Imperial Navigation Hub */
        nav { 
            padding: 0.8rem 1rem; 
            background: rgba(10, 20, 15, 0.96);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 4px 25px rgba(0,0,0,0.85);
            flex-wrap: wrap;
            backdrop-filter: blur(12px);
            box-sizing: border-box;
            width: 100%;
        }

        .nav-module {
            position: relative;
        }

        nav a { 
            font-family: 'Cinzel', serif;
            color: #f3e5ab; 
            text-decoration: none; 
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        nav a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px var(--gold);
        }

        /* Library Sub-Menu */
        .library-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(14, 26, 20, 0.98);
            border: 1px solid var(--gold);
            border-radius: 6px;
            margin-top: 8px;
            padding: 8px;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            z-index: 1100;
            min-width: 150px;
            text-align: center;
        }

        .library-dropdown a {
            font-size: 0.76rem;
            padding: 6px 10px;
            display: block;
            border-radius: 4px;
        }

        .library-dropdown a:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        /* Main Container layout */
        .container {
            display: flex;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            min-height: calc(100vh - 55px);
            background: linear-gradient(135deg, #06140e 0%, #0d2218 50%, #050d09 100%);
        }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
        }

        /* Cinematic Viewport */
        .character-viewport {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, var(--ambient-glow) 0%, #06120d 85%);
            padding: 30px 20px;
            box-sizing: border-box;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .container.theater-mode .character-viewport {
            flex: 2.5;
        }
        .container.theater-mode .control-sidebar {
            width: 340px;
        }

        .media-frame-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
        }

        .viewport-expand-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(14, 26, 20, 0.85);
            border: 2px solid var(--gold);
            color: var(--gold);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .viewport-expand-btn:hover {
            transform: scale(1.1);
            background: var(--gold);
            color: #06120d;
            box-shadow: 0 0 20px var(--gold);
        }

        .media-frame {
            width: 100%;
            height: min(78vh, 750px);
            border: 2px solid var(--gold);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 35px var(--ambient-glow);
        }

        .avatar-preview-media {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center center;
            display: block;
            position: relative;
            z-index: 2;
        }

        .media-caption {
            margin-top: 14px;
            color: var(--gold);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Cinzel', serif;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            z-index: 10;
        }

        /* Control Sidebar */
        .control-sidebar {
            width: 460px;
            background: var(--panel-bg);
            border-left: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            padding: 25px;
            gap: 18px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: -10px 0 30px rgba(0,0,0,0.7);
            transition: width 0.4s ease;
        }

        @media (max-width: 1024px) {
            .control-sidebar { width: 100%; border-left: none; border-top: 2px solid var(--gold); }
        }

        .panel-title {
            color: var(--gold);
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-family: 'Cinzel', serif;
            border-bottom: 1px solid rgba(212, 175, 55, 0.35);
            padding-bottom: 8px;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .option-card {
            background: #0f1f17;
            border: 1px solid #284a37;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            transition: all 0.3s ease;
        }

        .option-card:hover, .option-card.selected {
            border-color: var(--gold);
            color: var(--text-main);
            background: #173627;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.4), 0 0 10px rgba(255, 140, 0, 0.3);
            font-weight: bold;
        }

        /* Wardrobe Grid */
        .wardrobe-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .wardrobe-card {
            background: #0f1f17;
            border: 1px solid #284a37;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .wardrobe-card img, .wardrobe-card video {
            width: 100%;
            height: 95px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #000;
        }

        .wardrobe-card span {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .wardrobe-card:hover, .wardrobe-card.selected {
            border-color: var(--accent-orange);
            background: #173627;
            box-shadow: 0 0 18px rgba(255, 140, 0, 0.45);
            transform: translateY(-2px);
        }

        .wardrobe-card.selected span {
            color: var(--gold-hover);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 140, 0, 0.6);
        }

        .action-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-btn {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #06120d;
            border: none;
            padding: 13px 20px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }

        .game-btn:hover {
            background: linear-gradient(135deg, #ffdf7e, #d4af37);
            box-shadow: 0 0 22px rgba(255, 140, 0, 0.7);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Unified Imperial Top Navigation Hub -->
    <nav> 
        <div class="nav-module"><a href="index.html">🏠 Home</a></div>
        
        <div class="nav-module" onmouseenter="toggleLibraryMenu(true)" onmouseleave="toggleLibraryMenu(false)">
            <a href="library.html">📚 Library ▾</a>
            <div class="library-dropdown" id="libraryDropdown">
                <a href="trailers.html">🎬 Trailers</a>
                <a href="garden.html">🌸 Garden</a>
                <a href="room-elder.html">🌿 Elder Sanctuary</a>
            </div>
        </div>

        <div class="nav-module"><a href="battle.html">⚔️ Battle</a></div>
        <div class="nav-module"><a href="proving-grounds.html">🛡️ Youth</a></div>
        <div class="nav-module"><a href="shop.html">🪙 Imperial Shop</a></div>
        <div class="nav-module"><a href="landing.html">🎁 Support Vision</a></div>
        <div class="nav-module"><a href="community.html">💬 Community</a></div>
    </nav>

    <div class="container" id="mainContainer">
        <!-- Cinematic Viewport -->
        <div class="character-viewport">
            <div class="media-frame-wrapper">
                <button class="viewport-expand-btn" id="expandToggleBtn" onclick="toggleTheaterMode()" title="Toggle Theater Fullscreen">⤢</button>
                <div class="media-frame" id="media-container">
                    <video id="media-video" class="avatar-preview-media" autoplay loop muted controls style="display: block;">
                        <source id="video-source" src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <img id="media-image" class="avatar-preview-media" src="" alt="Royal Wardrobe Asset" style="display: none;">
                </div>
            </div>
            <div id="media-caption" class="media-caption">Loading...</div>
        </div>

        <!-- Control Sidebar -->
        <div class="control-sidebar">
            <div class="panel-title">Sovereign Profile</div>
            <div class="option-grid">
                <div class="option-card" onclick="setProfile('queen')">Queen</div>
                <div class="option-card selected" onclick="setProfile('king')">King</div>
                <div class="option-card" onclick="setProfile('together')">Together</div>
            </div>

            <div class="panel-title">
                <span>Wardrobe & Cinematics</span>
                <span style="font-size: 0.7rem; color: var(--accent-orange);">✨ HD Previews</span>
            </div>
            <div class="wardrobe-grid" id="wardrobe-list"></div>

            <div class="action-footer">
                <a href="gateway.html" class="game-btn" style="background: transparent; color: var(--gold); border: 1px solid var(--gold);">Return to Gateway</a>
            </div>
        </div>
    </div>

    <script>
        const assets = {
            king: [
                { name: "king-benson-imperial-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-royal-robe-CINEMATIC.mp4", type: "video" },
                { name: "king-benson-step-mother-cinematic.mp4", type: "video" },
                { name: "king-benson-sword-cinematic.mp4", type: "video" },
                { name: "king-benson-white-CINEMATIC.mp4", type: "video" },
                { name: "king_benson.png", type: "image" },
                { name: "king_benson-1.png", type: "image" },
                { name: "king_benson-11.png", type: "image" },
                { name: "king-benson-outfit-10.png", type: "image" },
                { name: "king-benson-outfit-15.png", type: "image" },
                { name: "king-benson-outift-7-1.png", type: "image" },
                { name: "king-benson-outift-9.png", type: "image" },
                { name: "king-benson-outift-9-1.png", type: "image" },
                { name: "king-benson-outift-12.png", type: "image" },
                { name: "king-benson-on-horse-cinematic.png", type: "image" },
                { name: "king-benson-on-horse.png", type: "image" },
                { name: "king-benson-hunting-clothes-meduim.png", type: "image" },
                { name: "king-benson-hunting-clothes-meduim-1.png", type: "image" },
                { name: "king-benson-mother-cinematic.png", type: "image" },
                { name: "king-benson-queen-rosanna-hop-horse.png", type: "image" }
            ],
            queen: [
                { name: "Queen-rosanna-perfect-gown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-3-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-flower-crown-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-best-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-formal-event.cinematic.mp4", type: "video" },
                { name: "rosanna-eagle-cinematic.mp4", type: "video" },
                { name: "rosanna-imperial-cinematic.mp4", type: "video" },
                { name: "rosanna-green-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-imperial-outfit-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-read-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-imperial-white-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "rosanna-pink-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-purple-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-relax-green-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-song-of-love-harem.mp4", type: "video" },
                { name: "rosanna-tea-INEMATIC.mp4", type: "video" },
                { name: "rosanna-white-2-CINEMATIC.mp4", type: "video" },
                { name: "rosanna-white-CINEMATIC.mp4", type: "video" },
                { name: "royal-love-story-CINEMATIC.mp4", type: "video" },
                { name: "queen-throne-CINEMATIC-1.mp4", type: "video" }
            ],
            together: [
                { name: "king-queen-moving-carriage-CNEMATIC.mp4", type: "video" },
                { name: "king-queen-same-sky-cinematic.mp4", type: "video" },
                { name: "king-queen-pink-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-purple-CINEMATIC-2.mp4", type: "video" },
                { name: "king-queen-royal-purple-CINEMATIC-5.mp4", type: "video" },
                { name: "king-queen-story-of-love-cinematic.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC-1.mp4", type: "video" },
                { name: "king-queen-throne-armor-CINEMATIC.mp4", type: "video" },
                { name: "king-queen-white-CINEMATIC-4.mp4", type: "video" },
                { name: "imperial-royal-wedding-cinematic.mp4", type: "video" },
                { name: "imperial-palace.mp4", type: "video" },
                { name: "imperial-palace-hallway.mp4", type: "video" },
                { name: "imperial-palace-guess-room.mp4", type: "video" },
                { name: "imperial-bedroom.mp4", type: "video" }
            ]
        };

        let currentProfile = localStorage.getItem('imperial_wardrobe_profile') || 'king';

        function toggleLibraryMenu(show) {
            document.getElementById('libraryDropdown').style.display = show ? 'flex' : 'none';
        }

        function toggleTheaterMode() {
            const container = document.getElementById('mainContainer');
            const btn = document.getElementById('expandToggleBtn');
            container.classList.toggle('theater-mode');
            if(container.classList.contains('theater-mode')) {
                btn.innerHTML = '⤡';
                btn.title = "Exit Theater Mode";
            } else {
                btn.innerHTML = '⤢';
                btn.title = "Toggle Theater Fullscreen";
            }
        }

        function setProfile(profile) {
            currentProfile = profile;
            localStorage.setItem('imperial_wardrobe_profile', profile);
            
            document.querySelectorAll('.control-sidebar .option-grid .option-card').forEach(c => {
                c.classList.remove('selected');
                if(c.textContent.toLowerCase() === profile) c.classList.add('selected');
            });
            loadWardrobeList();
        }

        function loadWardrobeList() {
            const listContainer = document.getElementById('wardrobe-list');
            listContainer.innerHTML = '';
            
            const items = assets[currentProfile];
            if (!items || items.length === 0) return;

            let lastAsset = localStorage.getItem(`imperial_last_asset_${currentProfile}`) || items[0].name;
            let activeItem = items.find(i => i.name === lastAsset) || items[0];

            selectMedia(activeItem.name, activeItem.type);

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'wardrobe-card' + (item.name === activeItem.name ? ' selected' : '');
                
                if (item.type === 'video') {
                    card.innerHTML = `<video src="${item.name}" muted preload="metadata"></video><span>${item.name.replace(/-CINEMATIC\.mp4|\.mp4/gi, '')}</span>`;
                } else {
                    card.innerHTML = `<img src="${item.name}" alt="asset" loading="lazy"><span>${item.name.replace(/\.png/gi, '')}</span>`;
                }

                card.onclick = () => {
                    document.querySelectorAll('.wardrobe-card').forEach(i => i.classList.remove('selected'));
                    card.classList.add('selected');
                    localStorage.setItem(`imperial_last_asset_${currentProfile}`, item.name);
                    selectMedia(item.name, item.type);
                };
                listContainer.appendChild(card);
            });
        }

        function selectMedia(fileName, fileType) {
            const videoElem = document.getElementById('media-video');
            const sourceElem = document.getElementById('video-source');
            const imageElem = document.getElementById('media-image');
            const captionElem = document.getElementById('media-caption');

            captionElem.textContent = fileName;
            updateAmbientAura(fileName);

            if (fileType === 'video') {
                videoElem.style.display = 'block';
                imageElem.style.display = 'none';
                sourceElem.src = fileName;
                videoElem.load();
            } else {
                videoElem.style.display = 'none';
                imageElem.style.display = 'block';
                imageElem.src = fileName;
            }
        }

        function updateAmbientAura(name) {
            let glowColor = "rgba(212, 175, 55, 0.28)";
            if (name.includes('pink') || name.includes('red')) {
                glowColor = "rgba(255, 140, 0, 0.35)";
            } else if (name.includes('purple') || name.includes('royal-purple')) {
                glowColor = "rgba(138, 43, 226, 0.35)";
            } else if (name.includes('green')) {
                glowColor = "rgba(46, 139, 87, 0.35)";
            } else if (name.includes('white')) {
                glowColor = "rgba(240, 248, 255, 0.35)";
            }
            document.documentElement.style.setProperty('--ambient-glow', glowColor);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setProfile(currentProfile);
        });
    </script>
</body>
</html>
